<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SENAI — Dashboard de Aulas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <script>
    (function () {
      if (!localStorage.getItem("senai_role"))
        window.location.replace("login.html");
    })();
  </script>
  <body>
    <div class="header">
      <a
        class="header-logo"
        href="index.html"
        style="text-decoration: none; color: #fff"
        >SENAI</a
      >
      <span class="header-title" id="headerTitle">Carregando...</span>
      <span class="header-spacer"></span>
      <span class="header-badge" id="headerBadge">— / — aulas</span>
      <span
        id="roleBadge"
        style="
          font-size: 11px;
          background: rgba(255, 255, 255, 0.2);
          padding: 3px 10px;
          border-radius: 20px;
          white-space: nowrap;
          margin-left: 8px;
        "
      ></span>
      <button
        onclick="sairSessao()"
        style="
          display: flex;
          align-items: center;
          gap: 6px;
          background: rgba(255, 255, 255, 0.15);
          border: none;
          color: #fff;
          font-size: 13px;
          font-weight: 500;
          padding: 6px 14px;
          border-radius: 20px;
          cursor: pointer;
          text-decoration: none;
          transition: background 0.15s;
          margin-left: 8px;
        "
        onmouseover="this.style.background = 'rgba(255,255,255,.28)'"
        onmouseout="this.style.background = 'rgba(255,255,255,.15)'"
      >
        🚪 Sair
      </button>
    </div>

    <div class="subheader">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar" style="width: 0%"></div>
      </div>
      <span class="progress-text" id="progressText">Carregando...</span>
    </div>

    <div class="grid-section">
      <div class="section-header">
        <div class="section-label">Calendário de Aulas</div>
        <button class="btn-nova-aula" onclick="abrirCadastro()">
          ＋ Nova Aula
        </button>
      </div>
      <div class="grid" id="grid">
        <p style="color: #888; font-size: 14px">Carregando aulas...</p>
      </div>
    </div>

    <!-- Modal CRUD de Aulas -->
    <div class="crud-modal-bg" id="crudModalBg">
      <div class="crud-modal">
        <div class="crud-modal-head">
          <h3 id="crudModalTitulo">Nova Aula</h3>
          <button
            onclick="fecharCrud()"
            style="
              background: none;
              border: none;
              color: #fff;
              font-size: 20px;
              cursor: pointer;
              line-height: 1;
            "
          >
            ✕
          </button>
        </div>
        <div class="crud-modal-body">
          <input type="hidden" id="crudNumeroOriginal" />
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Número</label>
              <input
                class="form-input"
                id="crudNumero"
                type="number"
                min="1"
                placeholder="Ex: 5"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Ícone (emoji)</label>
              <input
                class="form-input"
                id="crudIcone"
                type="text"
                placeholder="Ex: 📚"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Título da Aula</label>
            <input
              class="form-input"
              id="crudTitulo"
              type="text"
              placeholder="Ex: Internet e World Wide Web"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Data</label>
              <input
                class="form-input"
                id="crudData"
                type="text"
                placeholder="Ex: 07-08-2026"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Dia da Semana</label>
              <input
                class="form-input"
                id="crudDia"
                type="text"
                placeholder="Ex: Quinta-feira"
              />
            </div>
          </div>
          <div
            class="form-group"
            style="display: flex; align-items: center; gap: 10px"
          >
            <label class="form-label" style="margin: 0"
              >Visível aos alunos</label
            >
            <label class="toggle-sm">
              <input type="checkbox" id="crudVisivel" />
              <span class="toggle-sm-slider"></span>
            </label>
          </div>
          <div class="crud-divider">Materiais</div>
          <div class="mat-list" id="crudMatList"></div>
          <button class="btn-add-mat" onclick="abrirAddMaterial()">
            ＋ Adicionar Material
          </button>
          <div class="crud-actions">
            <button
              class="btn-danger"
              id="crudBtnExcluir"
              onclick="excluirAula()"
              style="display: none"
            >
              🗑 Excluir Aula
            </button>
            <button class="btn-secondary" onclick="fecharCrud()">
              Cancelar
            </button>
            <button class="btn-primary" onclick="salvarAula()">
              💾 Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Adicionar Material -->
    <div class="crud-modal-bg" id="matModalBg">
      <div class="crud-modal" style="max-width: 440px">
        <div class="crud-modal-head">
          <h3>Adicionar Material</h3>
          <button
            onclick="fecharAddMaterial()"
            style="
              background: none;
              border: none;
              color: #fff;
              font-size: 20px;
              cursor: pointer;
              line-height: 1;
            "
          >
            ✕
          </button>
        </div>
        <div class="crud-modal-body">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Ícone</label>
              <input class="form-input" id="matIcone" placeholder="📄" />
            </div>
            <div class="form-group">
              <label class="form-label">Tipo</label>
              <select class="form-input" id="matTipo">
                <option value="">Slide / Arquivo</option>
                <option value="questionario">Questionário</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Nome do Material</label>
            <input
              class="form-input"
              id="matNome"
              placeholder="Ex: Slide — Internet e WWW"
            />
          </div>
          <div class="form-group">
            <label class="form-label">Arquivo / URL</label>
            <input
              class="form-input"
              id="matArquivo"
              placeholder="Caminho relativo ou https://..."
            />
          </div>
          <div class="crud-actions">
            <button class="btn-secondary" onclick="fecharAddMaterial()">
              Cancelar
            </button>
            <button class="btn-primary" onclick="confirmarAddMaterial()">
              ＋ Adicionar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Membros Equipe -->
    <div class="membros-modal-bg" id="membrosModalBg">
      <div class="membros-modal">
        <div class="membros-modal-head">
          <h3 id="membrosModalTitulo">Membros das Equipes</h3>
          <button class="membros-modal-close" onclick="fecharMembros()">
            ✕
          </button>
        </div>
        <div class="membros-body">
          <div class="membros-titulo-grupo" id="membrosGrupoLabel"></div>
          <div class="membros-grid" id="membrosGrid"></div>
        </div>
      </div>
    </div>

    <!-- Modal Atividade (lê .txt diretamente) -->
    <div class="iframe-modal-bg" id="iframeModalBg">
      <div class="iframe-modal">
        <div class="iframe-modal-head">
          <h3 id="iframeModalTitulo">Atividade em Equipes</h3>
          <button class="iframe-modal-close" onclick="fecharIframe()">✕</button>
        </div>
        <div class="atividade-body">
          <pre id="iframeModalPre" class="atividade-pre">Carregando...</pre>
        </div>
      </div>
    </div>

    <!-- Modal para múltiplos materiais -->
    <div class="modal-bg" id="modalBg">
      <div class="modal">
        <div class="modal-header">
          <span class="modal-icon" id="modalIcon"></span>
          <div class="modal-info">
            <div class="modal-num" id="modalNum"></div>
            <div class="modal-titulo" id="modalTitulo"></div>
          </div>
          <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div class="modal-list" id="modalList"></div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://jwasbzdbkbryncpvfujc.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3YXNiemRia2JyeW5jcHZmdWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY4MzA3ODEsImV4cCI6MjA2MjQwNjc4MX0.Bz7aZ6yG6DUTtWQ4WdeNbslWzE4qU81zzblUeHdTduU";
      let cursoId = 1;
      let todasAulas = [];

      (async () => {
        let dados;
        try {
          const cursoParam =
            new URLSearchParams(location.search).get("curso") || "uc1";
          const r = await fetch(
            `${SUPABASE_URL}/rest/v1/curso?select=id,nome_completo,materias&codigo=eq.${encodeURIComponent(cursoParam)}&limit=1`,
            { headers: { apikey: SUPABASE_KEY } },
          );
          const rows = await r.json();
          if (!Array.isArray(rows) || rows.length === 0)
            throw new Error("sem dados");
          cursoId = rows[0].id;
          dados = { curso: rows[0].nome_completo, aulas: rows[0].materias };
        } catch {
          document.getElementById("grid").innerHTML =
            '<p style="color:#d32f2f;font-size:14px">Erro ao carregar dados do Supabase</p>';
          return;
        }

        const aulas = dados.aulas || [];

        // Injeta materiais locais na Aula 04
        const aula04 = aulas.find((a) => Number(a.numero) === 4);
        if (aula04) {
          if (!Array.isArray(aula04.materiais)) aula04.materiais = [];
          if (!aula04.materiais.some((m) => m.tipo === "atividade")) {
            aula04.materiais.push({
              nome: "Atividade em Equipes",
              tipo: "atividade",
              icone: "👥",
              arquivo:
                "INTRODUCAO_A_TECNOLOGIA_DA_INFORMACAO_E_COMUNICACAO/AULAS_INTRODUCAO_TECNOLOGIA_INFORMACAO/AULA 04 - 06-08-2026/ATIVIDADE_EQUIPE_06_08_2026.txt",
            });
          }
          if (!aula04.materiais.some((m) => m.tipo === "membros")) {
            aula04.materiais.push({
              nome: "Membros Equipe",
              tipo: "membros",
              icone: "👨‍👩‍👧‍👦",
              arquivo:
                "INTRODUCAO_A_TECNOLOGIA_DA_INFORMACAO_E_COMUNICACAO/AULAS_INTRODUCAO_TECNOLOGIA_INFORMACAO/AULA 04 - 06-08-2026/MEMBROS-EQUIPE-06-08-2026.txt",
            });
          }
        }

        todasAulas = aulas;
        const visiveis = aulas.filter((a) => Number(a.visivel) === 1).length;

        // Header
        document.getElementById("headerTitle").textContent =
          dados.curso || "Dashboard de Aulas";
        document.getElementById("headerBadge").textContent =
          `${visiveis} / ${aulas.length} aulas`;

        // Progress
        const pct = aulas.length
          ? Math.round((visiveis / aulas.length) * 100)
          : 0;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progressText").textContent =
          `${pct}% do conteúdo disponível`;

        // Grid
        const grid = document.getElementById("grid");
        grid.innerHTML = "";

        aulas.forEach((aula) => {
          const disponivel = aulNumber(a.visivel) === 1;
          const card = document.createElement("div");
          card.className =
            "card " + (disponivel ? "card-available" : "card-locked");

          const materiaisHTML = disponivel
            ? aula.materiais
                .filter((m) => Number(m.visivel) !== 0)
                .map((m) => {
                  if (m.tipo === "membros") {
                    return `<div class="material-row">
              <button class="material-membros" onclick="abrirMembros('${m.arquivo}', '${m.nome}')">
                <span class="material-icon">${m.icone || "👨‍👩‍👧‍👦"}</span>
                <span class="material-nome">${m.nome}</span>
                <span class="material-arrow">↗</span>
              </button>
            </div>`;
                  }
                  if (m.tipo === "atividade") {
                    return `<div class="material-row">
              <button class="material-atividade" onclick="abrirIframe('${m.arquivo}', '${m.nome}')">
                <span class="material-icon">${m.icone || "👥"}</span>
                <span class="material-nome">${m.nome}</span>
                <span class="material-arrow">↗</span>
              </button>
            </div>`;
                  }
                  if (m.tipo === "questionario") {
                    if (m.arquivo === "#") {
                      return `<div class="material-row">
                <span class="material-quiz-em-breve">
                  <span class="material-icon">${m.icone || "📝"}</span>
                  <span class="material-nome">${m.nome} — em breve</span>
                </span>
              </div>`;
                    }
                    return `<div class="material-row">
              <a class="material-quiz" href="${m.arquivo}" target="_blank">
                <span class="material-icon">${m.icone || "📝"}</span>
                <span class="material-nome">${m.nome}</span>
                <span class="material-arrow">↗</span>
              </a>
            </div>`;
                  }
                  return `<div class="material-row">
            <a class="material-btn" href="${m.arquivo}" target="_blank">
              <span class="material-icon">${m.icone || "📄"}</span>
              <span class="material-nome">${m.nome}</span>
              <span class="material-arrow">↗</span>
            </a>
            <a class="material-pdf" href="${m.arquivo}#print" target="_blank" title="Abrir e imprimir como PDF">⬇ PDF</a>
          </div>`;
                })
                .join("")
            : `<div class="locked-badge">
           <span class="locked-icon">🔒</span>
           <span class="locked-msg">Conteúdo indisponível</span>
         </div>`;

          card.innerHTML = `
      <div class="card-header">
        <button class="card-edit-btn" onclick="event.stopPropagation();abrirEdicao(${aula.numero})">✏️ Editar</button>
        <div class="card-icon">${disponivel ? aula.icone || "📚" : "🔒"}</div>
        <div class="card-meta">
          <div class="card-numero">Aula ${String(aula.numero).padStart(2, "0")}</div>
          <div class="card-titulo">${aula.titulo}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-data-row">
          <span class="card-dia">${aula.diaSemana}</span>
          <span class="card-data">📅 ${aula.data}</span>
        </div>
        <div class="materiais-list">${materiaisHTML}</div>
      </div>
      <div class="card-edit-bar">
        <span class="edit-label-small">${disponivel ? "🟢 Visível aos alunos" : "🔒 Bloqueada"}</span>
        <label class="toggle-sm">
          <input type="checkbox" ${disponivel ? "checked" : ""} onchange="toggleAula(${aula.numero}, this.checked)">
          <span class="toggle-sm-slider"></span>
        </label>
      </div>`;

          // Card com múltiplos materiais: abre modal ao clicar no header
          if (disponivel && aula.materiais.length > 1) {
            const header = card.querySelector(".card-header");
            header.style.cursor = "pointer";
            header.title = "Clique para ver os materiais";
            header.addEventListener("click", () => abrirModal(aula));
          }

          grid.appendChild(card);
        });

        // Modal
        const modalBg = document.getElementById("modalBg");
        const modalClose = document.getElementById("modalClose");
        modalClose.addEventListener("click", () =>
          modalBg.classList.remove("open"),
        );
        modalBg.addEventListener("click", (e) => {
          if (e.target === modalBg) modalBg.classList.remove("open");
        });

        function abrirModal(aula) {
          document.getElementById("modalIcon").textContent = aula.icone || "📚";
          document.getElementById("modalNum").textContent =
            `Aula ${String(aula.numero).padStart(2, "0")} · ${aula.data}`;
          document.getElementById("modalTitulo").textContent = aula.titulo;
          const list = document.getElementById("modalList");
          list.innerHTML = aula.materiais
            .filter((m) => Number(m.visivel) !== 0)
            .map((m) => {
              if (m.tipo === "membros") {
                return `<div class="modal-material-row">
          <button class="modal-material-membros" onclick="abrirMembros('${m.arquivo}', '${m.nome}')">
            <span class="modal-material-icon">${m.icone || "👨‍👩‍👧‍👦"}</span>
            <span class="modal-material-nome">${m.nome}</span>
            <span class="modal-material-arrow" style="color:#00796b">↗</span>
          </button>
        </div>`;
              }
              if (m.tipo === "atividade") {
                return `<div class="modal-material-row">
          <button class="modal-material-atividade" onclick="abrirIframe('${m.arquivo}', '${m.nome}')">
            <span class="modal-material-icon">${m.icone || "👥"}</span>
            <span class="modal-material-nome">${m.nome}</span>
            <span class="modal-material-arrow" style="color:#7b1fa2">↗</span>
          </button>
        </div>`;
              }
              if (m.tipo === "questionario") {
                if (m.arquivo === "#") {
                  return `<div class="modal-material-row">
            <span class="modal-material-btn" style="color:#aaa;border-color:#e0e0e0;background:#f8f9fa;cursor:not-allowed">
              <span class="modal-material-icon">${m.icone || "📝"}</span>
              <span class="modal-material-nome">${m.nome} — em breve</span>
            </span>
          </div>`;
                }
                return `<div class="modal-material-row">
          <a class="modal-material-btn" href="${m.arquivo}" target="_blank" style="border-color:#1b5e20;background:#f1f8f2;color:#1b5e20">
            <span class="modal-material-icon">${m.icone || "📝"}</span>
            <span class="modal-material-nome">${m.nome}</span>
            <span class="modal-material-arrow" style="color:#1b5e20">↗</span>
          </a>
        </div>`;
              }
              return `<div class="modal-material-row">
        <a class="modal-material-btn" href="${m.arquivo}" target="_blank">
          <span class="modal-material-icon">${m.icone || "📄"}</span>
          <span class="modal-material-nome">${m.nome}</span>
          <span class="modal-material-arrow">↗</span>
        </a>
        <a class="modal-material-pdf" href="${m.arquivo}#print" target="_blank" title="Abrir e imprimir como PDF">⬇ PDF</a>
      </div>`;
            })
            .join("");
          modalBg.classList.add("open");
        }
      })();

      // ── Sessão / perfil ──────────────────────────────────────────
      (function () {
        const role = localStorage.getItem("senai_role") || "ALUNO";
        const badge = document.getElementById("roleBadge");
        if (role === "PROFESSOR") {
          badge.textContent = "👨‍🏫 Professor";
          document.body.classList.add("professor");
        } else {
          badge.textContent = "👨‍🎓 Aluno";
        }
      })();

      async function toggleAula(numero, liberado) {
        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/toggle_aula_visivel`,
            {
              method: "POST",
              headers: {
                apikey: SUPABASE_KEY,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                p_curso_id: cursoId,
                p_aula_numero: numero,
                p_visivel: liberado ? 1 : 0,
              }),
            },
          );
          if (res.ok) location.reload();
          else alert("Erro ao atualizar a aula. Tente novamente.");
        } catch {
          alert("Erro de conexão.");
        }
      }

      function sairSessao() {
        localStorage.removeItem("senai_role");
        localStorage.removeItem("senai_login");
        window.location.href = "login.html";
      }

      // ── CRUD Aulas ─────────────────────────────────────────────────
      let materiaisTemp = [];
      let editandoNumero = null;

      function abrirCadastro() {
        editandoNumero = null;
        document.getElementById("crudModalTitulo").textContent = "Nova Aula";
        document.getElementById("crudNumeroOriginal").value = "";
        document.getElementById("crudNumero").value = "";
        document.getElementById("crudIcone").value = "📚";
        document.getElementById("crudTitulo").value = "";
        document.getElementById("crudData").value = "";
        document.getElementById("crudDia").value = "";
        document.getElementById("crudVisivel").checked = false;
        document.getElementById("crudBtnExcluir").style.display = "none";
        materiaisTemp = [];
        renderMatList();
        document.getElementById("crudModalBg").classList.add("open");
      }

      function abrirEdicao(numero) {
        const aula = todasAulas.find((a) => a.numero === numero);
        if (!aula) return;
        editandoNumero = numero;
        document.getElementById("crudModalTitulo").textContent =
          "Editar Aula " + String(numero).padStart(2, "0");
        document.getElementById("crudNumeroOriginal").value = numero;
        document.getElementById("crudNumero").value = numero;
        document.getElementById("crudIcone").value = aula.icone || "📚";
        document.getElementById("crudTitulo").value = aula.titulo || "";
        document.getElementById("crudData").value = aula.data || "";
        document.getElementById("crudDia").value = aula.diaSemana || "";
        document.getElementById("crudVisivel").checked = aulNumber(a.visivel) === 1;
        document.getElementById("crudBtnExcluir").style.display = "block";
        materiaisTemp = JSON.parse(JSON.stringify(aula.materiais || []));
        renderMatList();
        document.getElementById("crudModalBg").classList.add("open");
      }

      function fecharCrud() {
        document.getElementById("crudModalBg").classList.remove("open");
      }

      function renderMatList() {
        const el = document.getElementById("crudMatList");
        if (materiaisTemp.length === 0) {
          el.innerHTML =
            '<p style="font-size:12px;color:#aaa;text-align:center;padding:8px 0">Nenhum material ainda</p>';
          return;
        }
        el.innerHTML = materiaisTemp
          .map(
            (m, i) => `
          <div class="mat-item">
            <span style="font-size:18px">${m.icone || "📄"}</span>
            <div class="mat-item-info">
              <div class="mat-item-nome">${m.nome}</div>
              <div class="mat-item-arquivo">${m.arquivo}</div>
            </div>
            <button class="btn-mat-del" onclick="removerMaterial(${i})">✕</button>
          </div>`,
          )
          .join("");
      }

      function removerMaterial(i) {
        materiaisTemp.splice(i, 1);
        renderMatList();
      }

      function abrirAddMaterial() {
        document.getElementById("matIcone").value = "📄";
        document.getElementById("matNome").value = "";
        document.getElementById("matArquivo").value = "";
        document.getElementById("matTipo").value = "";
        document.getElementById("matModalBg").classList.add("open");
      }

      function fecharAddMaterial() {
        document.getElementById("matModalBg").classList.remove("open");
      }

      function confirmarAddMaterial() {
        const nome = document.getElementById("matNome").value.trim();
        const arquivo = document.getElementById("matArquivo").value.trim();
        if (!nome || !arquivo) {
          alert("Preencha nome e arquivo/URL.");
          return;
        }
        const m = {
          nome,
          arquivo,
          icone: document.getElementById("matIcone").value.trim() || "📄",
        };
        const tipo = document.getElementById("matTipo").value;
        if (tipo) m.tipo = tipo;
        materiaisTemp.push(m);
        renderMatList();
        fecharAddMaterial();
      }

      async function salvarAula() {
        const numero = parseInt(document.getElementById("crudNumero").value);
        const titulo = document.getElementById("crudTitulo").value.trim();
        if (!numero || !titulo) {
          alert("Preencha número e título.");
          return;
        }
        const novaAula = {
          numero,
          titulo,
          icone: document.getElementById("crudIcone").value.trim() || "📚",
          data: document.getElementById("crudData").value.trim(),
          diaSemana: document.getElementById("crudDia").value.trim(),
          visivel: document.getElementById("crudVisivel").checked ? 1 : 0,
          materiais: materiaisTemp,
        };
        const aulas = JSON.parse(JSON.stringify(todasAulas));
        if (editandoNumero !== null) {
          const idx = aulas.findIndex((a) => a.numero === editandoNumero);
          if (idx >= 0) aulas[idx] = novaAula;
          else aulas.push(novaAula);
        } else {
          aulas.push(novaAula);
          aulas.sort((a, b) => a.numero - b.numero);
        }
        await patchMaterias(aulas);
      }

      async function excluirAula() {
        if (
          !confirm(
            `Excluir a Aula ${editandoNumero}? Esta ação não pode ser desfeita.`,
          )
        )
          return;
        const aulas = todasAulas.filter((a) => a.numero !== editandoNumero);
        await patchMaterias(aulas);
      }

      async function patchMaterias(aulas) {
        try {
          const res = await fetch(
            `${SUPABASE_URL}/rest/v1/curso?id=eq.${cursoId}`,
            {
              method: "PATCH",
              headers: {
                apikey: SUPABASE_KEY,
                "Content-Type": "application/json",
                Prefer: "return=minimal",
              },
              body: JSON.stringify({ materias: aulas }),
            },
          );
          if (res.ok) {
            fecharCrud();
            location.reload();
          } else {
            const err = await res.text();
            alert("Erro ao salvar: " + err);
          }
        } catch {
          alert("Erro de conexão. Tente novamente.");
        }
      }

      // Fechar modais CRUD ao clicar fora
      document.getElementById("crudModalBg").addEventListener("click", (e) => {
        if (e.target === document.getElementById("crudModalBg")) fecharCrud();
      });
      document.getElementById("matModalBg").addEventListener("click", (e) => {
        if (e.target === document.getElementById("matModalBg"))
          fecharAddMaterial();
      });

      // ── Modal Atividade (lê arquivo .txt diretamente) ─────────────
      async function abrirIframe(url, titulo) {
        document.getElementById("iframeModalTitulo").textContent =
          titulo || "Atividade";
        const pre = document.getElementById("iframeModalPre");
        pre.innerHTML = '<span style="color:#888">Carregando...</span>';
        document.getElementById("iframeModalBg").classList.add("open");
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          const txt = await r.text();
          pre.innerHTML = txt
            .split("\n")
            .map((line) => {
              const esc = line
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
              if (/^={10,}/.test(line))
                return `<span class="at-sep">${esc}</span>`;
              if (/^-{10,}/.test(line))
                return `<span class="at-dash">${esc}</span>`;
              if (
                /^\s{0,4}[A-ZÁÉÍÓÚÃÕÀÂÊÎÔÛÇ][A-ZÁÉÍÓÚÃÕÀÂÊÎÔÛÇ\s\d—·–\/]+$/.test(
                  line.trim(),
                ) &&
                line.trim().length > 4
              )
                return `<span class="at-title">${esc}</span>`;
              if (/^\s*(QUESTÃO|PARTE|CRITÉRIO|ATA|ORIENTAÇ)/.test(line))
                return `<span class="at-section">${esc}</span>`;
              if (/^\s*[A-Z]\)/.test(line) || /^\s*\[/.test(line))
                return `<span class="at-item">${esc}</span>`;
              return esc;
            })
            .join("\n");
        } catch (err) {
          pre.textContent = "Erro ao carregar o arquivo: " + err.message;
        }
      }
      
      function fecharIframe() {
        document.getElementById("iframeModalBg").classList.remove("open");
        document.getElementById("iframeModalPre").textContent = "";
      }
      document
        .getElementById("iframeModalBg")
        .addEventListener("click", (e) => {
          if (e.target === document.getElementById("iframeModalBg"))
            fecharIframe();
        });

      // ── Modal Membros Equipe ───────────────────────────────────────
      async function abrirMembros(url, titulo) {
        document.getElementById("membrosModalTitulo").textContent =
          titulo || "Membros das Equipes";
        const grid = document.getElementById("membrosGrid");
        const label = document.getElementById("membrosGrupoLabel");
        grid.innerHTML =
          '<p style="color:#888;font-size:13px">Carregando...</p>';
        document.getElementById("membrosModalBg").classList.add("open");
        try {
          const r = await fetch(url);
          if (!r.ok) throw new Error("HTTP " + r.status);
          const txt = await r.text();
          const linhas = txt.split("\n");
          // Extrai título do grupo (primeira linha antes do primeiro #)
          const primeiraLinha = linhas[0].trim();
          label.textContent = primeiraLinha.startsWith("#")
            ? ""
            : primeiraLinha;
          // Parseia equipes
          const equipes = [];
          let atual = null;
          for (const linha of linhas) {
            const t = linha.trim();
            if (!t || (!t.startsWith("#") && equipes.length === 0 && !atual))
              continue;
            if (t.startsWith("#")) {
              if (atual) equipes.push(atual);
              atual = { nome: t.replace(/^#+\s*/, ""), membros: [] };
              continue;
            }
            if (atual && t.includes("-")) {
              const idx = t.indexOf("-");
              const papel = t.slice(0, idx).trim();
              const nome = t.slice(idx + 1).trim();
              if (papel && nome) atual.membros.push({ papel, nome });
            }
          }
          if (atual) equipes.push(atual);
          // Renderiza cards
          grid.innerHTML = equipes
            .map(
              (eq) => `
            <div class="equipe-card">
              <div class="equipe-card-header">${eq.nome}</div>
              <div class="equipe-card-body">
                ${eq.membros
                  .map(
                    (m) => `
                  <div class="membro-row">
                    <span class="membro-papel">${m.papel}</span>
                    <span class="membro-nome">${m.nome}</span>
                  </div>`,
                  )
                  .join("")}
              </div>
            </div>`,
            )
            .join("");
        } catch (err) {
          grid.innerHTML = `<p style="color:#d32f2f;font-size:13px">Erro: ${err.message}</p>`;
        }
      }
      function fecharMembros() {
        document.getElementById("membrosModalBg").classList.remove("open");
        document.getElementById("membrosGrid").innerHTML = "";
      }
      document
        .getElementById("membrosModalBg")
        .addEventListener("click", (e) => {
          if (e.target === document.getElementById("membrosModalBg"))
            fecharMembros();
        });
    </script>
  </body>

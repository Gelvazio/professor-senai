<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENAI — Dashboard de Aulas</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Google Sans',Roboto,Arial,sans-serif;background:#e8eaed;min-height:100vh}

/* ── Header ── */
.header{background:#004384;color:#fff;padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.header-logo{font-weight:700;font-size:15px;letter-spacing:.5px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:4px;white-space:nowrap}
.header-title{font-size:14px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header-spacer{flex:1}
.header-badge{font-size:12px;background:rgba(255,255,255,.15);padding:3px 12px;border-radius:20px;white-space:nowrap}

/* ── Subheader ── */
.subheader{background:#fff;border-bottom:1px solid #ddd;padding:10px 24px;display:flex;align-items:center;gap:16px}
.progress-bar-wrap{flex:1;height:6px;background:#e0e0e0;border-radius:3px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#004384,#0071e3);border-radius:3px;transition:width .4s}
.progress-text{font-size:12px;color:#555;white-space:nowrap}

/* ── Grid ── */
.grid-section{padding:24px}
.section-label{font-size:11px;font-weight:600;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ── Card ── */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden;transition:box-shadow .2s,transform .15s;position:relative}
.card-available:hover{box-shadow:0 4px 16px rgba(0,67,132,.2);transform:translateY(-2px);cursor:pointer}
.card-locked{opacity:.65;cursor:not-allowed}

.card-header{background:linear-gradient(135deg,#004384 0%,#0055b3 100%);padding:16px 18px 14px;display:flex;align-items:flex-start;gap:12px}
.card-locked .card-header{background:linear-gradient(135deg,#7a8390 0%,#9aa0a6 100%)}
.card-icon{font-size:28px;line-height:1;flex-shrink:0;margin-top:2px}
.card-meta{flex:1;min-width:0}
.card-numero{font-size:10px;font-weight:600;letter-spacing:1px;color:rgba(255,255,255,.7);text-transform:uppercase;margin-bottom:2px}
.card-titulo{font-size:14px;font-weight:700;color:#fff;line-height:1.3}

.card-body{padding:14px 18px 16px}
.card-data-row{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.card-dia{font-size:11px;color:#666;background:#f1f3f4;padding:2px 8px;border-radius:20px}
.card-data{font-size:12px;color:#444;font-weight:500}

/* Materials list */
.materiais-list{display:flex;flex-direction:column;gap:6px}
.material-row{display:flex;align-items:center;gap:5px}
.material-btn{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:1px solid #e0e0e0;background:#fafafa;text-decoration:none;color:#004384;font-size:12px;font-weight:500;transition:background .15s,border-color .15s;min-width:0}
.material-btn:hover{background:#e8f0fe;border-color:#004384}
.material-icon{font-size:15px;flex-shrink:0}
.material-nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.material-arrow{font-size:11px;color:#999;flex-shrink:0}
.material-pdf{display:flex;align-items:center;justify-content:center;gap:3px;padding:8px 9px;border-radius:6px;border:1px solid #f7941d;background:#fff8f0;color:#f7941d;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none;transition:background .15s}
.material-pdf:hover{background:#f7941d;color:#fff}
.material-quiz{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:1px solid #1b5e20;background:#f1f8f2;text-decoration:none;color:#1b5e20;font-size:12px;font-weight:600;transition:background .15s,border-color .15s}
.material-quiz:hover{background:#1b5e20;color:#fff}
.material-quiz-em-breve{flex:1;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;border:1px solid #e0e0e0;background:#f8f9fa;color:#aaa;font-size:12px;font-weight:500;cursor:not-allowed}

/* Locked overlay */
.locked-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 0 4px;color:#999}
.locked-icon{font-size:32px}
.locked-msg{font-size:11px;color:#aaa}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:10px;padding:24px;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.modal-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.modal-icon{font-size:32px}
.modal-info{flex:1}
.modal-num{font-size:10px;color:#004384;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.modal-titulo{font-size:16px;font-weight:700;color:#202124}
.modal-close{background:none;border:none;font-size:22px;color:#999;cursor:pointer;padding:2px 6px;border-radius:4px;line-height:1}
.modal-close:hover{background:#f1f3f4;color:#444}
.modal-list{display:flex;flex-direction:column;gap:8px}
.modal-material-row{display:flex;align-items:center;gap:6px}
.modal-material-btn{flex:1;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;border:1px solid #e0e0e0;background:#fafafa;text-decoration:none;color:#004384;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.modal-material-btn:hover{background:#e8f0fe;border-color:#004384}
.modal-material-icon{font-size:20px}
.modal-material-nome{flex:1}
.modal-material-arrow{color:#0071e3;font-size:14px}
.modal-material-pdf{display:flex;align-items:center;gap:4px;padding:10px 12px;border-radius:8px;border:1px solid #f7941d;background:#fff8f0;color:#f7941d;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0;transition:background .15s}
.modal-material-pdf:hover{background:#f7941d;color:#fff}

/* ── Toggle de aula (só professor) ── */
.card-edit-bar{display:none;padding:8px 16px;background:#f8f9fa;border-top:1px solid #e8eaed;align-items:center;justify-content:space-between;gap:8px}
body.professor .card-edit-bar{display:flex}
.edit-label-small{font-size:11px;color:#666;font-weight:500}
.toggle-sm{position:relative;width:36px;height:20px;flex-shrink:0}
.toggle-sm input{opacity:0;width:0;height:0;position:absolute}
.toggle-sm-slider{position:absolute;inset:0;background:#ccc;border-radius:20px;cursor:pointer;transition:background .2s}
.toggle-sm-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle-sm input:checked + .toggle-sm-slider{background:#2e7d32}
.toggle-sm input:checked + .toggle-sm-slider:before{transform:translateX(16px)}
</style>
</head>
<script>
(function(){
  if(!localStorage.getItem('senai_role')) window.location.replace('login.html');
})();
</script>
<body>

<div class="header">
  <a class="header-logo" href="index.html" style="text-decoration:none;color:#fff">SENAI</a>
  <span class="header-title" id="headerTitle">Carregando...</span>
  <span class="header-spacer"></span>
  <span class="header-badge" id="headerBadge">— / — aulas</span>
  <span id="roleBadge" style="font-size:11px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:20px;white-space:nowrap;margin-left:8px"></span>
  <a href="questionarios.html" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;text-decoration:none;transition:background .15s;margin-left:8px" onmouseover="this.style.background='rgba(255,255,255,.28)'" onmouseout="this.style.background='rgba(255,255,255,.15)'">📋 Questionários</a>
  <button onclick="sairSessao()" style="display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;text-decoration:none;transition:background .15s;margin-left:8px" onmouseover="this.style.background='rgba(255,255,255,.28)'" onmouseout="this.style.background='rgba(255,255,255,.15)'">🚪 Sair</button>
</div>

<div class="subheader">
  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%"></div>
  </div>
  <span class="progress-text" id="progressText">Carregando...</span>
</div>

<div class="grid-section">
  <div class="section-label">Calendário de Aulas</div>
  <div class="grid" id="grid">
    <p style="color:#888;font-size:14px">Carregando aulas...</p>
  </div>
</div>

<!-- Modal para múltiplos materiais -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-icon" id="modalIcon"></span>
      <div class="modal-info">
        <div class="modal-num" id="modalNum"></div>
        <div class="modal-titulo" id="modalTitulo"></div>
      </div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-list" id="modalList"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://jwasbzdbkbryncpvfujc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3YXNiemRia2JyeW5jcHZmdWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY4MzA3ODEsImV4cCI6MjA2MjQwNjc4MX0.Bz7aZ6yG6DUTtWQ4WdeNbslWzE4qU81zzblUeHdTduU';
let cursoId = 1;

(async () => {
  let dados;
  try {
    const cursoParam = new URLSearchParams(location.search).get('curso') || 'uc1';
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/curso?select=id,descricaocurso,materias&codigo=eq.${encodeURIComponent(cursoParam)}&limit=1`,
      { headers: { 'apikey': SUPABASE_KEY } }
    );
    const rows = await r.json();
    if (!Array.isArray(rows) || rows.length === 0) throw new Error('sem dados');
    cursoId = rows[0].id;
    dados = { curso: rows[0].descricaocurso, aulas: rows[0].materias };
  } catch {
    document.getElementById('grid').innerHTML =
      '<p style="color:#d32f2f;font-size:14px">Erro ao carregar dados do Supabase</p>';
    return;
  }

  const aulas = dados.aulas || [];
  const visiveis = aulas.filter(a => a.visivel === 1).length;

  // Header
  document.getElementById('headerTitle').textContent = dados.curso || 'Dashboard de Aulas';
  document.getElementById('headerBadge').textContent = `${visiveis} / ${aulas.length} aulas`;

  // Progress
  const pct = aulas.length ? Math.round((visiveis / aulas.length) * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${pct}% do conteúdo disponível`;

  // Grid
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  aulas.forEach(aula => {
    const disponivel = aula.visivel === 1;
    const card = document.createElement('div');
    card.className = 'card ' + (disponivel ? 'card-available' : 'card-locked');

    const materiaisHTML = disponivel
      ? aula.materiais.filter(m => m.visivel !== 0).map(m => {
          if (m.tipo === 'questionario') {
            if (m.arquivo === '#') {
              return `<div class="material-row">
                <span class="material-quiz-em-breve">
                  <span class="material-icon">${m.icone || '📝'}</span>
                  <span class="material-nome">${m.nome} — em breve</span>
                </span>
              </div>`;
            }
            return `<div class="material-row">
              <a class="material-quiz" href="${m.arquivo}" target="_blank">
                <span class="material-icon">${m.icone || '📝'}</span>
                <span class="material-nome">${m.nome}</span>
                <span class="material-arrow">↗</span>
              </a>
            </div>`;
          }
          return `<div class="material-row">
            <a class="material-btn" href="${m.arquivo}" target="_blank">
              <span class="material-icon">${m.icone || '📄'}</span>
              <span class="material-nome">${m.nome}</span>
              <span class="material-arrow">↗</span>
            </a>
            <a class="material-pdf" href="${m.arquivo}#print" target="_blank" title="Abrir e imprimir como PDF">⬇ PDF</a>
          </div>`;
        }).join('')
      : `<div class="locked-badge">
           <span class="locked-icon">🔒</span>
           <span class="locked-msg">Conteúdo indisponível</span>
         </div>`;

    card.innerHTML = `
      <div class="card-header">
        <div class="card-icon">${disponivel ? (aula.icone || '📚') : '🔒'}</div>
        <div class="card-meta">
          <div class="card-numero">Aula ${String(aula.numero).padStart(2,'0')}</div>
          <div class="card-titulo">${aula.titulo}</div>
        </div>
      </div>
      <div class="card-body">
        <div class="card-data-row">
          <span class="card-dia">${aula.diaSemana}</span>
          <span class="card-data">📅 ${aula.data}</span>
        </div>
        <div class="materiais-list">${materiaisHTML}</div>
      </div>
      <div class="card-edit-bar">
        <span class="edit-label-small">${disponivel ? '🟢 Visível aos alunos' : '🔒 Bloqueada'}</span>
        <label class="toggle-sm">
          <input type="checkbox" ${disponivel ? 'checked' : ''} onchange="toggleAula(${aula.numero}, this.checked)">
          <span class="toggle-sm-slider"></span>
        </label>
      </div>`;

    // Card com múltiplos materiais: abre modal ao clicar no header
    if (disponivel && aula.materiais.length > 1) {
      const header = card.querySelector('.card-header');
      header.style.cursor = 'pointer';
      header.title = 'Clique para ver os materiais';
      header.addEventListener('click', () => abrirModal(aula));
    }

    grid.appendChild(card);
  });

  // Modal
  const modalBg = document.getElementById('modalBg');
  const modalClose = document.getElementById('modalClose');
  modalClose.addEventListener('click', () => modalBg.classList.remove('open'));
  modalBg.addEventListener('click', e => { if (e.target === modalBg) modalBg.classList.remove('open'); });

  function abrirModal(aula) {
    document.getElementById('modalIcon').textContent = aula.icone || '📚';
    document.getElementById('modalNum').textContent = `Aula ${String(aula.numero).padStart(2,'0')} · ${aula.data}`;
    document.getElementById('modalTitulo').textContent = aula.titulo;
    const list = document.getElementById('modalList');
    list.innerHTML = aula.materiais.filter(m => m.visivel !== 0).map(m => {
      if (m.tipo === 'questionario') {
        if (m.arquivo === '#') {
          return `<div class="modal-material-row">
            <span class="modal-material-btn" style="color:#aaa;border-color:#e0e0e0;background:#f8f9fa;cursor:not-allowed">
              <span class="modal-material-icon">${m.icone || '📝'}</span>
              <span class="modal-material-nome">${m.nome} — em breve</span>
            </span>
          </div>`;
        }
        return `<div class="modal-material-row">
          <a class="modal-material-btn" href="${m.arquivo}" target="_blank" style="border-color:#1b5e20;background:#f1f8f2;color:#1b5e20">
            <span class="modal-material-icon">${m.icone || '📝'}</span>
            <span class="modal-material-nome">${m.nome}</span>
            <span class="modal-material-arrow" style="color:#1b5e20">↗</span>
          </a>
        </div>`;
      }
      return `<div class="modal-material-row">
        <a class="modal-material-btn" href="${m.arquivo}" target="_blank">
          <span class="modal-material-icon">${m.icone || '📄'}</span>
          <span class="modal-material-nome">${m.nome}</span>
          <span class="modal-material-arrow">↗</span>
        </a>
        <a class="modal-material-pdf" href="${m.arquivo}#print" target="_blank" title="Abrir e imprimir como PDF">⬇ PDF</a>
      </div>`;
    }).join('');
    modalBg.classList.add('open');
  }
})();

// ── Sessão / perfil ──────────────────────────────────────────
(function () {
  const role = localStorage.getItem('senai_role') || 'ALUNO';
  const badge = document.getElementById('roleBadge');
  if (role === 'PROFESSOR') {
    badge.textContent = '👨‍🏫 Professor';
    document.body.classList.add('professor');
  } else {
    badge.textContent = '👨‍🎓 Aluno';
  }
})();

async function toggleAula(numero, liberado) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/toggle_aula_visivel`, {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_curso_id: cursoId, p_aula_numero: numero, p_visivel: liberado ? 1 : 0 })
    });
    if (res.ok) location.reload();
    else alert('Erro ao atualizar a aula. Tente novamente.');
  } catch { alert('Erro de conexão.'); }
}

function sairSessao() {
  localStorage.removeItem('senai_role');
  localStorage.removeItem('senai_login');
  window.location.href = 'login.html';
}
</script>
</body>
</html>

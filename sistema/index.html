<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENAI e Tecnologia 3.0</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Google Sans',Roboto,Arial,sans-serif;background:#004384;min-height:100vh;display:flex;align-items:center;justify-content:center}

.card{background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.35);width:100%;max-width:380px;overflow:hidden}

.card-header{background:linear-gradient(135deg,#004384 0%,#0055b3 100%);padding:32px 28px 24px;text-align:center}
.logo{display:inline-block;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:18px;letter-spacing:1px;padding:6px 18px;border-radius:6px;margin-bottom:16px}
.card-header h2{color:#fff;font-size:17px;font-weight:600;margin-bottom:4px}
.card-header p{color:rgba(255,255,255,.75);font-size:12px}

.card-body{padding:28px}

.field{margin-bottom:18px}
.field label{display:block;font-size:12px;font-weight:600;color:#444;margin-bottom:6px;letter-spacing:.3px}
.field select,
.field input{width:100%;padding:10px 13px;border:1px solid #ddd;border-radius:6px;font-size:14px;color:#202124;background:#fafafa;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
.field select:focus,
.field input:focus{border-color:#004384;box-shadow:0 0 0 3px rgba(0,67,132,.12);background:#fff}

.btn-login{width:100%;padding:12px;background:#004384;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s;margin-top:4px}
.btn-login:hover{background:#00306a}
.btn-login:active{transform:scale(.98)}
.btn-login:disabled{background:#9aa0a6;cursor:not-allowed;transform:none}

.error{display:none;background:#fce8e6;border:1px solid #f44336;color:#c62828;font-size:12px;padding:10px 13px;border-radius:6px;margin-bottom:14px;text-align:center}
.error.show{display:block}

.spinner{display:none;text-align:center;margin-top:8px;font-size:12px;color:#666}
.spinner.show{display:block}

.footer{text-align:center;font-size:11px;color:#aaa;padding:14px;border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:center;gap:10px}
/* ── Tema Escuro ── */
[data-theme="dark"] body{background:#0a0d18}
[data-theme="dark"] .card{background:#1c1e2a;box-shadow:0 8px 40px rgba(0,0,0,.55)}
[data-theme="dark"] .card-body{background:#1c1e2a}
[data-theme="dark"] .field label{color:#9aa0ae}
[data-theme="dark"] .field select,
[data-theme="dark"] .field input{background:#252830;border-color:#3a3d4a;color:#e0e3e8}
[data-theme="dark"] .field select:focus,
[data-theme="dark"] .field input:focus{border-color:#5588cc;box-shadow:0 0 0 3px rgba(50,100,200,.15);background:#1e2032}
[data-theme="dark"] .error{background:#2a1010;border-color:#8b2020;color:#f08080}
[data-theme="dark"] .spinner{color:#9aa0ae}
[data-theme="dark"] .footer{color:#555;border-top-color:#2c2e38}
[data-theme="dark"] .btn-tema{color:#9aa0ae!important;border-color:#2c2e38!important}
[data-theme="dark"] .btn-tema:hover{background:#252830!important;color:#e0e3e8!important}
</style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="logo">SENAI</div>
    <h2>SENAI e Tecnologia 3.0</h2>
    <p>UC1 — Introdução à Tecnologia da Informação e Comunicação</p>
  </div>
  <div class="card-body">
    <div class="error" id="error">Usuário ou senha incorretos.</div>

    <div class="field">
      <label for="perfil">Perfil de acesso</label>
      <select id="perfil" onchange="toggleSenha()">
        <option value="ALUNO" selected>👨‍🎓 Aluno</option>
        <option value="PROFESSOR">👨‍🏫 Professor</option>
      </select>
    </div>

    <div class="field" id="campoSenha" style="display:none">
      <label for="senha">Senha do Professor</label>
      <input type="password" id="senha" placeholder="Digite a senha" autocomplete="current-password">
    </div>

    <button class="btn-login" id="btnLogin" onclick="fazerLogin()">Entrar</button>
    <div class="spinner" id="spinner">Verificando...</div>
  </div>
  <div class="footer">
    <span>Professor Gelvazio &nbsp;·&nbsp; SENAI 2026</span>
    <button onclick="toggleTema()" id="btnTema" class="btn-tema" style="border:1px solid #ddd;background:none;cursor:pointer;border-radius:20px;padding:3px 12px;font-size:11px;font-family:inherit;transition:.15s;color:#888">🌙</button>
  </div>
</div>

<script>
// Aplica tema salvo antes de renderizar (evita flash)
(function () {
  const t = localStorage.getItem("senai_tema") || "light";
  document.documentElement.setAttribute("data-theme", t);
})();

function toggleTema() {
  const t =
    document.documentElement.getAttribute("data-theme") === "dark"
      ? "light"
      : "dark";
  document.documentElement.setAttribute("data-theme", t);
  localStorage.setItem("senai_tema", t);
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = t === "dark" ? "☀️" : "🌙";
}

window.addEventListener("DOMContentLoaded", function () {
  const t = localStorage.getItem("senai_tema") || "light";
  const btn = document.getElementById("btnTema");
  if (btn) btn.textContent = t === "dark" ? "☀️" : "🌙";
});


const SUPABASE_URL = 'https://jwasbzdbkbryncpvfujc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3YXNiemRia2JyeW5jcHZmdWpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY4MzA3ODEsImV4cCI6MjA2MjQwNjc4MX0.Bz7aZ6yG6DUTtWQ4WdeNbslWzE4qU81zzblUeHdTduU';
const HASH_ALUNO   = 'a21d6f3803f0491c32444ef91a0836be243cc4da5186357e805b7009a5b0669b';

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function toggleSenha() {
  const perfil = document.getElementById('perfil').value;
  document.getElementById('campoSenha').style.display = perfil === 'PROFESSOR' ? '' : 'none';
}

document.getElementById('senha').addEventListener('keydown', e => {
  if (e.key === 'Enter') fazerLogin();
});

async function fazerLogin() {
  const perfil = document.getElementById('perfil').value;
  const senha  = document.getElementById('senha').value;
  const erro   = document.getElementById('error');
  const btn    = document.getElementById('btnLogin');
  const spin   = document.getElementById('spinner');

  erro.classList.remove('show');

  if (perfil === 'PROFESSOR' && !senha) {
    erro.textContent = 'Digite a senha do Professor.';
    erro.classList.add('show');
    return;
  }

  btn.disabled = true;
  spin.classList.add('show');

  const loginUsuario = perfil.toLowerCase();
  const hash = perfil === 'ALUNO' ? HASH_ALUNO : await sha256(senha);

  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/usuario?login_usuario=eq.${encodeURIComponent(loginUsuario)}&senha_hash=eq.${hash}&select=perfil`,
      { headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' } }
    );
    const rows = await res.json();

    if (Array.isArray(rows) && rows.length > 0) {
      localStorage.setItem('senai_role', rows[0].perfil);
      localStorage.setItem('senai_login', Date.now());
      window.location.href = 'dashboard.html';
    } else {
      erro.textContent = 'Senha incorreta. Tente novamente.';
      erro.classList.add('show');
      document.getElementById('senha').value = '';
      btn.disabled = false;
      spin.classList.remove('show');
    }
  } catch {
    erro.textContent = 'Erro de conexão. Tente novamente.';
    erro.classList.add('show');
    btn.disabled = false;
    spin.classList.remove('show');
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SENAI — Cursos e Unidades Curriculares</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Google Sans",Roboto,Arial,sans-serif;background:#e8eaed;min-height:100vh}

    /* ── HEADER ── */
    .header{background:#004384;color:#fff;padding:0 24px;display:flex;align-items:center;gap:10px;height:56px;flex-wrap:wrap}
    .header-logo{font-weight:700;font-size:15px;letter-spacing:.5px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:4px;white-space:nowrap;text-decoration:none;color:#fff}
    .header-title{font-size:14px;opacity:.9;white-space:nowrap}
    .header-spacer{flex:1}
    .header-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;text-decoration:none;transition:background .15s;white-space:nowrap;font-family:inherit}
    .header-btn:hover{background:rgba(255,255,255,.28)}
    .btn-novo-curso{background:#f7941d;border:none;color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-novo-curso:hover{background:#e68200}
    .btn-conferencia{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-conferencia:hover{background:rgba(255,255,255,.3)}
    .badge-pend-hdr{background:#ef5350;color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}

    /* ── HERO ── */
    .hero{background:linear-gradient(135deg,#003068 0%,#004384 60%,#0055b3 100%);padding:28px 24px 22px;text-align:center;color:#fff;border-bottom:3px solid #f7941d}
    .hero-badge{display:inline-block;background:rgba(247,148,29,.2);border:1px solid rgba(247,148,29,.5);color:#f7941d;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:10px}
    .hero h1{font-size:22px;font-weight:700;margin-bottom:4px}
    .hero p{font-size:13px;opacity:.8}

    /* ── CONTAINER ── */
    .container{max-width:960px;margin:0 auto;padding:24px 24px}
    .section-label{font-size:11px;font-weight:600;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}

    /* ── CURSO SECTION ── */
    .curso-section{margin-bottom:22px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.09);overflow:hidden}
    .curso-header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s;user-select:none}
    .curso-header:hover{background:#f8f9fa}
    .curso-bar{width:5px;height:42px;border-radius:3px;flex-shrink:0}
    .curso-icone{font-size:22px;flex-shrink:0}
    .curso-meta{flex:1;min-width:0}
    .curso-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:2px}
    .curso-nome{font-size:15px;font-weight:700;color:#202124;line-height:1.3}
    .curso-count{font-size:11px;color:#888;margin-top:2px}
    .curso-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .btn-nova-uc{display:flex;align-items:center;gap:5px;background:#004384;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-nova-uc:hover{background:#00306a}
    .btn-del-curso{background:#fce8e6;color:#c62828;border:none;width:32px;height:32px;border-radius:6px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
    .btn-del-curso:hover{background:#ffcdd2}
    .curso-arrow{font-size:11px;color:#888;transition:transform .22s;flex-shrink:0}
    .curso-section.collapsed .curso-arrow{transform:rotate(-90deg)}

    /* ── UC CONTENT / GRID ── */
    .uc-content{padding:16px 20px 20px}
    .curso-section.collapsed .uc-content{display:none}
    .uc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:640px){.uc-grid{grid-template-columns:1fr}}

    /* ── UC CARD ── */
    .uc-card{background:#f8f9fa;border-radius:10px;border:1px solid #e8eaed;display:flex;flex-direction:column;transition:box-shadow .2s,transform .15s;cursor:pointer}
    .uc-card:hover{box-shadow:0 4px 16px rgba(0,67,132,.12);transform:translateY(-2px);background:#fff}
    .uc-card-top{height:5px;border-radius:10px 10px 0 0}
    .uc-card-body{padding:14px 16px 10px;flex:1;display:flex;flex-direction:column;gap:8px}
    .uc-header{display:flex;align-items:flex-start;gap:12px}
    .uc-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
    .uc-meta{flex:1;min-width:0}
    .uc-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:3px}
    .uc-nome{font-size:13px;font-weight:700;color:#202124;line-height:1.35}
    .uc-pasta{font-size:10px;color:#aaa;font-family:monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
    .badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
    .badge.ok{background:#e6f4ea;color:#1e7e34}
    .badge.falta{background:#fce8e6;color:#c62828}
    .badge-pend{background:#fff3e0;color:#e65100;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px}
    .badge-done{background:#e6f4ea;color:#1e7e34;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px}
    .uc-card-footer{padding:8px 16px 12px;border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .uc-status{display:flex;align-items:center;gap:5px;font-size:10px;color:#888}
    .uc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .btn-abrir{display:inline-flex;align-items:center;gap:5px;background:#004384;color:#fff;text-decoration:none;padding:6px 12px;border-radius:5px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-abrir:hover{background:#00306a}
    .btn-abrir.alerta{background:#e65100}
    .btn-abrir.alerta:hover{background:#bf360c}
    .btn-checklist{display:inline-flex;align-items:center;gap:4px;background:#f3e8ff;color:#7c3aed;border:1px solid #d8b4fe;padding:5px 10px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-checklist:hover{background:#ede9fe}
    .btn-del-uc{background:#fce8e6;color:#c62828;border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-del-uc:hover{background:#ffcdd2}

    /* ── EMPTY STATES ── */
    .empty-curso{text-align:center;padding:24px;color:#999;font-size:13px}
    .empty-root{text-align:center;padding:64px 24px;color:#888}
    .empty-root .e-icon{font-size:52px;margin-bottom:16px}
    .empty-root h3{font-size:18px;font-weight:700;color:#555;margin-bottom:8px}

    /* ── BACKDROP ── */
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}

    /* ── MODAL BASE ── */
    .modal{background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
    .modal-lg{max-width:680px}
    .modal-head{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .modal-head h3{margin:0;font-size:15px;font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .modal-close{background:rgba(255,255,255,.25);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:8px}
    .modal-close:hover{background:rgba(255,255,255,.4)}
    .modal-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
    .form-row{display:flex;flex-direction:column;gap:5px}
    .form-row label{font-size:12px;font-weight:600;color:#555}
    .form-row input[type=text],.form-row select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;background:#fff;color:#202124}
    .form-row input[type=text]:focus,.form-row select:focus{border-color:#004384;box-shadow:0 0 0 2px rgba(0,67,132,.1)}
    .form-row input[type=color]{width:100%;height:36px;padding:2px 4px;border:1px solid #ddd;border-radius:6px;cursor:pointer}
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#333}
    .form-check input{width:16px;height:16px;cursor:pointer;accent-color:#004384}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;flex-shrink:0}
    .btn-cancel{background:#f1f3f4;color:#444;border:none;padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-cancel:hover{background:#e0e0e0}
    .btn-save{background:#004384;color:#fff;border:none;padding:8px 22px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-save:hover{background:#00306a}

    /* ── ALERT MODAL ── */
    .alert-modal{background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);width:100%;max-width:480px}
    .alert-head{background:#e65100;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-radius:12px 12px 0 0}
    .alert-head h3{margin:0;font-size:15px;font-weight:700}
    .alert-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
    .alert-close:hover{background:rgba(255,255,255,.35)}
    .alert-body{padding:20px 24px 24px}
    .alert-body p{font-size:13px;color:#444;line-height:1.6;margin-bottom:12px}
    .alert-missing{list-style:none;display:flex;flex-direction:column;gap:8px}
    .alert-missing li{display:flex;align-items:center;gap:10px;background:#fce8e6;border-radius:8px;padding:10px 14px;font-size:13px;color:#c62828;font-weight:600}
    .alert-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .btn-fechar-alerta{background:#f1f3f4;color:#444;border:none;padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-fechar-alerta:hover{background:#e0e0e0}

    /* ── CHECKLIST MODAL ── */
    .cl-progress-bar{height:5px;background:#e8eaed;margin:0;flex-shrink:0}
    .cl-progress-fill{height:100%;background:#2e7d32;transition:width .3s}
    .cl-summary{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:#f8f9fa;border-bottom:1px solid #e8eaed;flex-shrink:0}
    .cl-summary-text{font-size:12px;color:#555}
    .cl-summary-pct{font-size:13px;font-weight:800;color:#2e7d32}
    .cl-fase{border-bottom:1px solid #f0f0f0}
    .cl-fase:last-child{border-bottom:none}
    .cl-fase-head{display:flex;align-items:center;gap:10px;padding:12px 20px;cursor:pointer;transition:background .15s;user-select:none}
    .cl-fase-head:hover{background:#f8f9fa}
    .cl-fase-num{width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .cl-fase-info{flex:1}
    .cl-fase-titulo{font-size:13px;font-weight:700;color:#202124}
    .cl-fase-sub{font-size:11px;color:#888}
    .cl-fase-count{font-size:11px;font-weight:700;color:#555;white-space:nowrap}
    .cl-fase-arrow{font-size:11px;color:#aaa;transition:transform .2s}
    .cl-fase.collapsed .cl-fase-arrow{transform:rotate(-90deg)}
    .cl-items{padding:4px 20px 12px 20px;display:flex;flex-direction:column;gap:4px}
    .cl-fase.collapsed .cl-items{display:none}
    .cl-item{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:7px;transition:background .15s;cursor:pointer}
    .cl-item:hover{background:#f5f5f5}
    .cl-item input[type=checkbox]{width:16px;height:16px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:#2e7d32}
    .cl-item-text{font-size:12.5px;color:#333;line-height:1.45}
    .cl-item.done .cl-item-text{color:#aaa;text-decoration:line-through}
    .cl-footer{padding:12px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
    .btn-reset{background:#fce8e6;color:#c62828;border:none;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-reset:hover{background:#ffcdd2}
    .btn-fechar-cl{background:#004384;color:#fff;border:none;padding:7px 20px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-fechar-cl:hover{background:#00306a}

    /* ── CONFERÊNCIA MODAL ── */
    .conf-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    .conf-stat{flex:1;min-width:100px;background:#f8f9fa;border-radius:8px;padding:10px 14px;text-align:center}
    .conf-stat-num{font-size:22px;font-weight:900;line-height:1}
    .conf-stat-lbl{font-size:10px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
    .conf-stat.vermelho .conf-stat-num{color:#c62828}
    .conf-stat.verde .conf-stat-num{color:#2e7d32}
    .conf-stat.azul .conf-stat-num{color:#004384}
    .conf-curso-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#888;margin:14px 0 6px}
    .conf-uc-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;border:1px solid #e8eaed;margin-bottom:6px;background:#fff;cursor:pointer;transition:box-shadow .15s}
    .conf-uc-row:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
    .conf-uc-row.ok{border-color:#c8e6c9;background:#f1f8f1}
    .conf-uc-icone{font-size:18px;flex-shrink:0}
    .conf-uc-info{flex:1;min-width:0}
    .conf-uc-nome{font-size:13px;font-weight:600;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conf-uc-fases{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
    .conf-fase-chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
    .conf-fase-chip.ok{background:#e6f4ea;color:#1e7e34}
    .conf-fase-chip.pend{background:#fff3e0;color:#e65100}
    .conf-pend-num{font-size:12px;font-weight:800;color:#c62828;white-space:nowrap;flex-shrink:0}
    .conf-pend-num.ok{color:#2e7d32}
    .conf-empty{text-align:center;padding:32px;color:#888}
    .conf-empty .e-icon{font-size:36px;margin-bottom:10px}

    /* ── MOBILE ── */
    @media(max-width:640px){
      .header{height:auto;min-height:48px;padding:8px 12px;gap:6px;flex-wrap:wrap}
      .header-title{display:none}
      .btn-novo-curso{font-size:12px;padding:6px 10px}
      .btn-conferencia{font-size:12px;padding:6px 10px}
      .header-btn{font-size:12px;padding:5px 10px}
      .hero{padding:18px 12px 14px}
      .hero h1{font-size:18px}
      .hero p{font-size:12px}
      .container{padding:14px 10px}
      .curso-header{padding:10px 12px;gap:8px;flex-wrap:wrap}
      .curso-actions{width:100%;justify-content:flex-end;margin-top:4px}
      .btn-nova-uc{font-size:11px;padding:5px 10px}
      .uc-card-footer{gap:6px}
      .btn-abrir,.btn-checklist{font-size:10px;padding:5px 9px}
      .modal{max-width:calc(100vw - 24px)}
      .form-grid-2{grid-template-columns:1fr}
      .conf-summary{gap:8px}
      .conf-stat{min-width:80px}
    }

    /* ── DARK THEME ── */
    [data-theme="dark"] body{background:#0e1117;color:#e0e3e8}
    [data-theme="dark"] .curso-section{background:#1c1e26;box-shadow:0 2px 10px rgba(0,0,0,.4)}
    [data-theme="dark"] .curso-header{border-bottom-color:#2c2e38}
    [data-theme="dark"] .curso-header:hover{background:#252830}
    [data-theme="dark"] .curso-nome{color:#e0e3e8}
    [data-theme="dark"] .curso-label,[data-theme="dark"] .curso-count{color:#6b7280}
    [data-theme="dark"] .uc-card{background:#252830;border-color:#2c2e38}
    [data-theme="dark"] .uc-card:hover{background:#2c2e38;box-shadow:0 4px 16px rgba(0,80,200,.15)}
    [data-theme="dark"] .uc-nome{color:#e0e3e8}
    [data-theme="dark"] .uc-num,[data-theme="dark"] .uc-status,[data-theme="dark"] .uc-pasta{color:#6b7280}
    [data-theme="dark"] .uc-card-footer{border-top-color:#2c2e38}
    [data-theme="dark"] .badge.ok{background:#1a2e1a;color:#4caf50}
    [data-theme="dark"] .badge.falta{background:#2e1a1a;color:#ef5350}
    [data-theme="dark"] .modal{background:#1c1e26}
    [data-theme="dark"] .form-row input[type=text],[data-theme="dark"] .form-row select{background:#252830;border-color:#2c2e38;color:#e0e3e8}
    [data-theme="dark"] .form-check{color:#c0c6d0}
    [data-theme="dark"] .alert-modal{background:#1c1e26}
    [data-theme="dark"] .alert-body p{color:#c0c6d0}
    [data-theme="dark"] .alert-missing li{background:#2e1a1a;color:#ef5350}
    [data-theme="dark"] .btn-cancel,[data-theme="dark"] .btn-fechar-alerta{background:#252830;color:#b0b6c3}
    [data-theme="dark"] .btn-cancel:hover,[data-theme="dark"] .btn-fechar-alerta:hover{background:#303340}
    [data-theme="dark"] .section-label{color:#8b919e}
    [data-theme="dark"] .empty-root h3{color:#9aa0b0}
    [data-theme="dark"] .empty-root p,[data-theme="dark"] .empty-curso{color:#6b7280}
    [data-theme="dark"] .cl-summary{background:#252830;border-color:#2c2e38}
    [data-theme="dark"] .cl-summary-text{color:#9aa0b0}
    [data-theme="dark"] .cl-progress-bar{background:#2c2e38}
    [data-theme="dark"] .cl-fase-titulo{color:#e0e3e8}
    [data-theme="dark"] .cl-item:hover{background:#252830}
    [data-theme="dark"] .cl-item-text{color:#c0c6d0}
    [data-theme="dark"] .cl-item.done .cl-item-text{color:#555}
    [data-theme="dark"] .cl-fase{border-color:#2c2e38}
    [data-theme="dark"] .cl-fase-head:hover{background:#252830}
    [data-theme="dark"] .cl-footer{border-color:#2c2e38}
    [data-theme="dark"] .conf-stat{background:#252830}
    [data-theme="dark"] .conf-uc-row{background:#252830;border-color:#2c2e38}
    [data-theme="dark"] .conf-uc-row:hover{box-shadow:0 2px 8px rgba(0,0,0,.3)}
    [data-theme="dark"] .conf-uc-row.ok{background:#1a2e1a;border-color:#2d4a2d}
    [data-theme="dark"] .conf-uc-nome{color:#e0e3e8}
  </style>
</head>
<body>
  <script>
    (function(){
      if(localStorage.getItem('senai_role')!=='PROFESSOR')
        window.location.replace('dashboard.html');
      const t=localStorage.getItem('senai_tema')||'dark';
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>

  <!-- HEADER -->
  <div class="header">
    <a class="header-logo" href="dashboard.html">SENAI</a>
    <span class="header-title">Cursos e UCs</span>
    <span class="header-spacer"></span>
    <button class="btn-conferencia" id="btnConf" onclick="abrirConferencia()">
      🔍 Conferência UCs <span class="badge-pend-hdr" id="hdrPend" style="display:none">0</span>
    </button>

    ];

    const TOTAL_ITEMS = CHECKLIST.reduce((s, f) => s + f.items.length, 0); // 38

    /* ══════════════════════════════════════════
       DADOS E STORAGE
    ══════════════════════════════════════════ */
    const CURSOS_KEY = 'senai_cursos_v2';
    const CL_KEY     = 'senai_checklist_v1';

    const DEFAULTS = [
      {
        id:'tii-rsmtech',
        nome:'Rio do Sul Mais Tech — Técnico de Informática para Internet',
        icone:'🖥️', cor:'#004384', custom:false,
        ucs:[
          {id:'uc-tic',    pasta:'INTRODUCAO_A_TECNOLOGIA_DA_INFORMACAO_E_COMUNICACAO',     nome:'Introdução à Tecnologia da Informação e Comunicação',                 icone:'💻', cor:'#004384', corBg:'#e8f0fe', status:'Em andamento', corDot:'#2e7d32', temAulas:true,  temMateriais:true,  pendencias:0, custom:false},
          {id:'uc-oral',   pasta:'INTRODUCAO_A_COMUNICACAO_ORAL_E_ESCRITA_PARA_O_MUNDO_DO_TRABALHO', nome:'Introdução à Comunicação Oral e Escrita para o Mundo do Trabalho', icone:'🗣️', cor:'#6a1b9a', corBg:'#f3e8ff', status:'Em andamento', corDot:'#2e7d32', temAulas:false, temMateriais:false, pendencias:0, custom:false},
          {id:'uc-logica', pasta:'LOGICA-PROGRAMACAO',                                       nome:'Lógica de Programação',                                               icone:'⚙️', cor:'#e65100', corBg:'#fff3e0', status:'Prevista',     corDot:'#f7941d', temAulas:false, temMateriais:false, pendencias:0, custom:false},
          {id:'uc-fund',   pasta:'FUNDAMENTOS_DA_TECNOLOGIA_E_PROGRAMACAO',                  nome:'Fundamentos da Tecnologia e Programação',                             icone:'🔧', cor:'#1565c0', corBg:'#e3f2fd', status:'Prevista',     corDot:'#f7941d', temAulas:false, temMateriais:false, pendencias:0, custom:false},
          {id:'uc-bd',     pasta:'BANCO_DE_DADOS',                                           nome:'Banco de Dados',                                                      icone:'🗄️', cor:'#2e7d32', corBg:'#e8f5e9', status:'Prevista',     corDot:'#f7941d', temAulas:true,  temMateriais:true,  pendencias:0, custom:false},
          {id:'uc-tii',    pasta:'TECNICO DE INFORMATICA PARA INTERNET',                     nome:'Técnico de Informática para Internet',                                icone:'🌐', cor:'#c62828', corBg:'#fce8e6', status:'Prevista',     corDot:'#f7941d', temAulas:false, temMateriais:false, pendencias:0, custom:false},
        ]
      }
    ];

    let CURSOS = [];
    let CL_DATA = {}; // { ucId: { itemId: bool } }
    let _pendenciasSupabaseCache = {}; // Cache de pendências do Supabase

    async function sbGet(tabela, filtro) {
      const url = `${SUPABASE_URL}/rest/v1/${tabela}?${filtro}`;
      const r = await fetch(url, { headers: { apikey: SUPABASE_KEY } });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return await r.json();
    }

    async function carregarPendenciasSupabase() {
      _pendenciasSupabaseCache = {};
      try {
        const materias = await sbGet('materia', 'select=*&ensalado=eq.true');
        const idsMaterias = materias.map(m => m.id).filter(Number.isFinite);

        if (idsMaterias.length === 0) return _pendenciasSupabaseCache;

        const avaliacoes = await sbGet('avaliacao', `materia_id=in.(${idsMaterias.join(',')})&select=*`);

        const totaisPorMateria = {};
        materias.forEach(materia => {
          totaisPorMateria[String(materia.id)] = CAMPOS_PENDENTES_MATERIA.reduce((total, campo) => {
            return total + (String(materia[campo] || 'PENDENTE').toUpperCase() === 'PENDENTE' ? 1 : 0);
          }, 0);
        });

        avaliacoes.forEach(avaliacao => {
          const materiaId = String(avaliacao.materia_id);
          const quantidade = CAMPOS_PENDENTES_AVALIACAO.reduce((total, campo) => {
            return total + (String(avaliacao[campo] || '').toUpperCase() === 'PENDENTE' ? 1 : 0);
          }, 0);
          totaisPorMateria[materiaId] = (totaisPorMateria[materiaId] || 0) + quantidade;
        });

        materias.forEach(materia => {
          _pendenciasSupabaseCache[String(materia.id)] = totaisPorMateria[String(materia.id)] || 0;
        });
      } catch (erro) {
        console.warn('Erro ao carregar pendências do Supabase:', erro);
      }
      return _pendenciasSupabaseCache;
    }

    async function loadAll() {
      const rawC = localStorage.getItem(CURSOS_KEY);
      CURSOS = rawC ? JSON.parse(rawC) : JSON.parse(JSON.stringify(DEFAULTS));
      const rawCL = localStorage.getItem(CL_KEY);
      CL_DATA = rawCL ? JSON.parse(rawCL) : {};

      // ⚠️ CARREGA PENDÊNCIAS DO SUPABASE — NÃO apenas do checklist
      await carregarPendenciasSupabase();

      CURSOS.forEach(c => c.ucs.forEach(uc => {
        uc.pendencias = calcPendencias(uc.id);
      }));
    }

    function saveCursos() { localStorage.setItem(CURSOS_KEY, JSON.stringify(CURSOS)); }
    function saveCL()     { localStorage.setItem(CL_KEY, JSON.stringify(CL_DATA)); }

    function getUCState(ucId) {
      if (!CL_DATA[ucId]) CL_DATA[ucId] = {};
      return CL_DATA[ucId];
    }

    function calcPendencias(ucId) {
      // ⚠️ REGRA CRÍTICA: Pendências vêm do Supabase, NÃO apenas do checklist
      // Busca o ID numérico da matéria correspondente à UC
      let materiasIds = [];
      CURSOS.forEach(curso => {
        const uc = curso.ucs.find(u => u.id === ucId);
        if (uc) {
          // Se houver dados do Supabase para essa matéria, usa aqueles
          for (let mid in _pendenciasSupabaseCache) {
            if (_pendenciasSupabaseCache[mid] > 0) {
              materiasIds.push(mid);
            }
          }
        }
      });

      // Soma pendências de todas as matérias vinculadas
      let pend = 0;
      materiasIds.forEach(mid => {
        pend += (_pendenciasSupabaseCache[mid] || 0);
      });

      return pend;
    }

    function calcChecked(ucId) {
      const state = CL_DATA[ucId] || {};
      let checked = 0;
      CHECKLIST.forEach(f => f.items.forEach(it => { if (state[it.id]) checked++; }));
      return checked;
    }

    /* ══════════════════════════════════════════
       HELPERS
    ══════════════════════════════════════════ */
    function hexToRgba(hex, a) {
      const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`;
    }
    function dotColor(s) {
      if(s==='Em andamento') return '#2e7d32';
      if(s==='Concluída')    return '#1565c0';
      if(s==='Suspensa')     return '#c62828';
      return '#f7941d';
    }
    function totalPendAll() {
      let n = 0;
      CURSOS.forEach(c => c.ucs.forEach(uc => { n += uc.pendencias; }));
      return n;
    }

    /* ══════════════════════════════════════════
       RENDER PRINCIPAL
    ══════════════════════════════════════════ */
    function renderCursos() {

      const hdrPend = document.getElementById('hdrPend');

      hdrPend.style.display = tp > 0 ? 'inline-block' : 'none';

      const totalUCs = CURSOS.reduce((s,c)=>s+c.ucs.length, 0);
      document.getElementById('sectionLabel').textContent =
        `${CURSOS.length} Curso${CURSOS.length!==1?'s':''} · ${totalUCs} Unidade${totalUCs!==1?'s Curriculares':' Curricular'} — Rio do Sul Mais Tech · SENAI`;

      const cont = document.getElementById('cursosContainer');
      if(!CURSOS.length){
        cont.innerHTML=`<div class="empty-root"><div class="e-icon">📂</div><h3>Nenhum curso cadastrado</h3><p>Clique em <strong>+ Novo Curso</strong> para começar.</p></div>`;
        return;
      }

      cont.innerHTML = CURSOS.map((curso, ci) => {
        const ucCards = curso.ucs.length===0
          ? `<div class="empty-curso">Nenhuma UC neste curso. Clique em <strong>+ Nova UC</strong>.</div>`
          : `<div class="uc-grid">${curso.ucs.map((uc,ui)=>ucCardHTML(curso,ci,uc,ui)).join('')}</div>`;
        return `
        <div class="curso-section" id="cs-${ci}">
          <div class="curso-header" onclick="toggleCurso(${ci})">
            <div class="curso-bar" style="background:${curso.cor}"></div>
            <div class="curso-icone">${curso.icone}</div>
            <div class="curso-meta">
              <div class="curso-label">Curso ${String(ci+1).padStart(2,'0')}</div>
              <div class="curso-nome">${curso.nome}</div>
              <div class="curso-count">${curso.ucs.length} UC${curso.ucs.length!==1?'s':''}</div>
            </div>
            <div class="curso-actions" onclick="event.stopPropagation()">
              <button class="btn-nova-uc" onclick="abrirModalUC('${curso.id}')">+ Nova UC</button>
              ${curso.custom?`<button class="btn-del-curso" onclick="excluirCurso('${curso.id}')">🗑</button>`:''}
            </div>
            <div class="curso-arrow">▼</div>
          </div>
          <div class="uc-content">${ucCards}</div>
        </div>`;
      }).join('');
    }

    function ucCardHTML(curso, ci, uc, ui) {
      const ok    = uc.temAulas && uc.temMateriais;
      const corBg = uc.corBg || hexToRgba(uc.cor, 0.12);
      const dot   = uc.corDot || dotColor(uc.status);
      const pend  = uc.pendencias || 0;
      const checked = calcChecked(uc.id);
      const pendBadge = pend > 0
        ? `<span class="badge-pend">⏳ ${pend} pendente${pend!==1?'s':''}</span>`
        : `<span class="badge-done">✓ Concluído</span>`;

      return `
      <div class="uc-card" onclick="abrirUC(${ci},${ui})">
        <div class="uc-card-top" style="background:${ok?uc.cor:'#e65100'}"></div>
        <div class="uc-card-body">
          <div class="uc-header">
            <div class="uc-icon" style="background:${corBg}">${uc.icone}</div>
            <div class="uc-meta">
              <div class="uc-num">UC ${String(ui+1).padStart(2,'0')}</div>
              <div class="uc-nome">${uc.nome}</div>
              <div class="uc-pasta">${uc.pasta}</div>
              <div class="uc-badges">
                <span class="badge ${uc.temAulas?'ok':'falta'}">${uc.temAulas?'✓':'✗'} AULAS</span>
                <span class="badge ${uc.temMateriais?'ok':'falta'}">${uc.temMateriais?'✓':'✗'} MATERIAIS</span>
                ${pendBadge}
              </div>
            </div>
          </div>
        </div>
        <div class="uc-card-footer">
          <div class="uc-status">
            <div class="uc-dot" style="background:${dot}"></div>${uc.status}
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            <button class="btn-checklist" onclick="event.stopPropagation();abrirChecklist('${curso.id}','${uc.id}')">📋 Checklist</button>
            ${uc.custom?`<button class="btn-del-uc" onclick="event.stopPropagation();excluirUC('${curso.id}','${uc.id}')">✕</button>`:''}
            <button class="btn-abrir${ok?'':' alerta'}" onclick="event.stopPropagation();abrirUC(${ci},${ui})">
              ${ok?'Acessar →':'⚠️ Incompleta'}
            </button>
          </div>
        </div>
      </div>`;
    }

    function toggleCurso(ci) {
      document.getElementById('cs-'+ci).classList.toggle('collapsed');

    /* ══════════════════════════════════════════
       ABRIR UC
    ══════════════════════════════════════════ */
    function abrirUC(ci, ui) {
      const uc = CURSOS[ci].ucs[ui];
      const faltando = [];
      if(!uc.temAulas)    faltando.push('Pasta <strong>AULAS/</strong> não encontrada');
      if(!uc.temMateriais) faltando.push('Pasta <strong>MATERIAIS/</strong> não encontrada');
      if(faltando.length){
        document.getElementById('alertMsg').innerHTML=`A UC <strong>${uc.nome}</strong> está com a estrutura incompleta:`;
        document.getElementById('alertList').innerHTML=faltando.map(f=>`<li>📁 ${f}</li>`).join('');
        document.getElementById('alertBd').style.display='flex'; return;
      }
      window.location.href = uc.pasta+'/';
    }
    function fecharAlerta(e){
      if(!e||e.target===document.getElementById('alertBd'))
        document.getElementById('alertBd').style.display='none';
    }

    /* ══════════════════════════════════════════
       MODAL NOVO CURSO
    ══════════════════════════════════════════ */
    function abrirModalCurso(){
      document.getElementById('inCursoNome').value='';
      document.getElementById('inCursoIcone').value='🖥️';
      document.getElementById('inCursoCor').value='#004384';
      document.getElementById('bdCurso').style.display='flex';
      setTimeout(()=>document.getElementById('inCursoNome').focus(),100);
    }
    function fecharModalCurso(e){
      if(!e||e.target===document.getElementById('bdCurso'))
        document.getElementById('bdCurso').style.display='none';
    }
    function salvarCurso(){
      const nome=document.getElementById('inCursoNome').value.trim();
      if(!nome){alert('Informe o nome do curso.');return;}
      CURSOS.push({id:'curso-'+Date.now(),nome,icone:document.getElementById('inCursoIcone').value.trim()||'🖥️',cor:document.getElementById('inCursoCor').value,custom:true,ucs:[]});
      saveCursos();renderCursos();fecharModalCurso();
    }

    /* ══════════════════════════════════════════
       MODAL NOVA UC
    ══════════════════════════════════════════ */
    function abrirModalUC(cursoId){
      const sel=document.getElementById('inUCCurso');
      sel.innerHTML=CURSOS.map(c=>`<option value="${c.id}"${c.id===cursoId?' selected':''}>${c.nome}</option>`).join('');
      ['inUCNome','inUCPasta'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('inUCIcone').value='📖';
      document.getElementById('inUCCor').value='#004384';
      document.getElementById('inUCStatus').value='Prevista';
      document.getElementById('inUCAulas').checked=false;
      document.getElementById('inUCMateriais').checked=false;
      document.getElementById('bdUC').style.display='flex';
      setTimeout(()=>document.getElementById('inUCNome').focus(),100);
    }
    function fecharModalUC(e){
      if(!e||e.target===document.getElementById('bdUC'))
        document.getElementById('bdUC').style.display='none';
    }
    function salvarUC(){
      const nome=document.getElementById('inUCNome').value.trim();
      if(!nome){alert('Informe o nome da UC.');return;}
      const cor=document.getElementById('inUCCor').value;
      const status=document.getElementById('inUCStatus').value;
      const pastaRaw=document.getElementById('inUCPasta').value.trim();
      const uc={
        id:'uc-'+Date.now(), nome,
        pasta:pastaRaw||nome.toUpperCase().replace(/\s+/g,'-').replace(/[^A-Z0-9\-_]/g,''),
        icone:document.getElementById('inUCIcone').value.trim()||'📖',
        cor, corBg:hexToRgba(cor,.12), status, corDot:dotColor(status),
        temAulas:document.getElementById('inUCAulas').checked,
        temMateriais:document.getElementById('inUCMateriais').checked,
        pendencias:TOTAL_ITEMS, custom:true
      };
      const curso=CURSOS.find(c=>c.id===document.getElementById('inUCCurso').value);
      if(!curso)return;
      curso.ucs.push(uc);saveCursos();renderCursos();fecharModalUC();
    }

    /* ══════════════════════════════════════════
       EXCLUSÃO
    ══════════════════════════════════════════ */
    function excluirCurso(id){
      if(!confirm('Excluir este curso e todas as suas UCs?'))return;
      CURSOS=CURSOS.filter(c=>c.id!==id);saveCursos();renderCursos();
    }
    function excluirUC(cursoId,ucId){
      if(!confirm('Remover esta UC?'))return;
      const c=CURSOS.find(c=>c.id===cursoId);
      if(!c)return;c.ucs=c.ucs.filter(u=>u.id!==ucId);saveCursos();renderCursos();
    }

    /* ══════════════════════════════════════════
       MODAL CHECKLIST
    ══════════════════════════════════════════ */
    let _clCursoId = null;
    let _clUcId    = null;

    function abrirChecklist(cursoId, ucId) {
      _clCursoId = cursoId;
      _clUcId    = ucId;
      const curso = CURSOS.find(c=>c.id===cursoId);
      const uc    = curso ? curso.ucs.find(u=>u.id===ucId) : null;
      if(!uc) return;

      document.getElementById('clTitulo').textContent = uc.nome + ' · Checklist Docente';
      document.getElementById('clHead').style.background = uc.cor || '#004384';
      renderChecklistBody();
      document.getElementById('bdCL').style.display='flex';
    }

    function renderChecklistBody() {
      const state   = getUCState(_clUcId);
      const checked = Object.values(state).filter(Boolean).length;
      const pct     = Math.round(checked / TOTAL_ITEMS * 100);

      document.getElementById('clProgFill').style.width = pct + '%';
      document.getElementById('clSummaryText').textContent = `${checked} de ${TOTAL_ITEMS} itens concluídos`;
      document.getElementById('clSummaryPct').textContent  = pct + '%';

      document.getElementById('clBody').innerHTML = CHECKLIST.map(fase => {
        const faseChecked = fase.items.filter(it=>state[it.id]).length;
        const faseTotal   = fase.items.length;
        const allDone     = faseChecked === faseTotal;
        return `
        <div class="cl-fase${allDone?' cl-done':''}">
          <div class="cl-fase-head" onclick="toggleFase('${fase.id}')">
            <div class="cl-fase-num" style="background:${fase.cor}">${fase.fase}</div>
            <div class="cl-fase-info">
              <div class="cl-fase-titulo">${fase.titulo}</div>
              <div class="cl-fase-sub">${fase.subtitulo}</div>
            </div>
            <div class="cl-fase-count" style="color:${allDone?'#2e7d32':'#e65100'}">${faseChecked}/${faseTotal}</div>
            <div class="cl-fase-arrow">▼</div>
          </div>
          <div class="cl-items">
            ${fase.items.map(it=>`
            <label class="cl-item${state[it.id]?' done':''}" id="clitem-${it.id}">
              <input type="checkbox" ${state[it.id]?'checked':''} onchange="toggleItem('${it.id}', this.checked)"/>
              <span class="cl-item-text">${it.texto}</span>
            </label>`).join('')}
          </div>
        </div>`;
      }).join('');
    }

    function toggleFase(faseId) {
      const el = document.querySelector(`.cl-fase .cl-fase-head[onclick="toggleFase('${faseId}')"]`);
      if(el) el.parentElement.classList.toggle('collapsed');
    }

    function toggleItem(itemId, checked) {
      const state = getUCState(_clUcId);
      state[itemId] = checked;
      saveCL();

      // Atualizar label
      const label = document.getElementById('clitem-' + itemId);
      if(label) label.classList.toggle('done', checked);

      // Recalcular e atualizar progresso
      const ckd = Object.values(state).filter(Boolean).length;
      const pct = Math.round(ckd / TOTAL_ITEMS * 100);
      document.getElementById('clProgFill').style.width = pct + '%';
      document.getElementById('clSummaryText').textContent = `${ckd} de ${TOTAL_ITEMS} itens concluídos`;
      document.getElementById('clSummaryPct').textContent  = pct + '%';

      // Atualizar contadores de fase
      CHECKLIST.forEach(fase => {
        if(fase.items.some(it=>it.id===itemId)) {
          const faseChecked = fase.items.filter(it=>state[it.id]).length;
          const faseTotal   = fase.items.length;
          const countEl = document.querySelector(`.cl-fase-head[onclick="toggleFase('${fase.id}')"] .cl-fase-count`);
          if(countEl){
            countEl.textContent = `${faseChecked}/${faseTotal}`;
            countEl.style.color = faseChecked===faseTotal ? '#2e7d32' : '#e65100';
          }
        }
      });

      // Atualizar pendências da UC no CURSOS e salvar
      const pend = calcPendencias(_clUcId);
      const curso = CURSOS.find(c=>c.id===_clCursoId);
      const uc    = curso ? curso.ucs.find(u=>u.id===_clUcId) : null;
      if(uc){ uc.pendencias = pend; saveCursos(); }

      // Atualizar badge no header
      const tp = totalPendAll();
      const hdrPend = document.getElementById('hdrPend');
      hdrPend.textContent = tp;
      hdrPend.style.display = tp > 0 ? 'inline-block' : 'none';
    }

    function resetChecklist() {
      if(!confirm('Desmarcar todos os itens desta UC?')) return;
      CL_DATA[_clUcId] = {};
      saveCL();
      const curso = CURSOS.find(c=>c.id===_clCursoId);
      const uc    = curso ? curso.ucs.find(u=>u.id===_clUcId) : null;
      if(uc){ uc.pendencias = TOTAL_ITEMS; saveCursos(); }
      renderChecklistBody();
      const tp = totalPendAll();
      const hdrPend = document.getElementById('hdrPend');
      hdrPend.textContent = tp;
      hdrPend.style.display = tp > 0 ? 'inline-block' : 'none';
    }

    function fecharChecklist(e) {
      if(!e||e.target===document.getElementById('bdCL'))
        document.getElementById('bdCL').style.display='none';
      renderCursos(); // atualiza badges nos cards
    }

    /* ══════════════════════════════════════════
       MODAL CONFERÊNCIA
    ══════════════════════════════════════════ */
    function abrirConferencia() {
      const body = document.getElementById('confBody');
      const totalUCs  = CURSOS.reduce((s,c)=>s+c.ucs.length, 0);
      const totalPend = CURSOS.reduce((s,c)=>s+c.ucs.reduce((ss,u)=>ss+(u.pendencias||0),0), 0);
      const ucsSemPend= CURSOS.reduce((s,c)=>s+c.ucs.filter(u=>(u.pendencias||0)===0).length, 0);

      let html = `
      <div class="conf-summary">
        <div class="conf-stat azul"><div class="conf-stat-num">${totalUCs}</div><div class="conf-stat-lbl">Total de UCs</div></div>
        <div class="conf-stat vermelho"><div class="conf-stat-num">${totalPend}</div><div class="conf-stat-lbl">Itens Pendentes</div></div>
        <div class="conf-stat verde"><div class="conf-stat-num">${ucsSemPend}</div><div class="conf-stat-lbl">UCs Concluídas</div></div>
      </div>`;

      let hasAnyPend = false;
      CURSOS.forEach(curso => {
        const ucsPend = curso.ucs.filter(uc=>(uc.pendencias||0)>0);
        if(!ucsPend.length) return;
        hasAnyPend = true;
        html += `<div class="conf-curso-label">${curso.icone} ${curso.nome}</div>`;
        ucsPend.forEach(uc => {
          const state = CL_DATA[uc.id] || {};
          const faseChips = CHECKLIST.map(fase => {
            const fPend = fase.items.filter(it=>!state[it.id]).length;
            return `<span class="conf-fase-chip ${fPend===0?'ok':'pend'}">${fase.fase}. ${fase.titulo}${fPend>0?' ('+fPend+')':' ✓'}</span>`;
          }).join('');
          html += `
          <div class="conf-uc-row" onclick="abrirChecklistFromConf('${curso.id}','${uc.id}')">
            <div class="conf-uc-icone">${uc.icone}</div>
            <div class="conf-uc-info">
              <div class="conf-uc-nome">${uc.nome}</div>
              <div class="conf-uc-fases">${faseChips}</div>
            </div>
            <div class="conf-pend-num">${uc.pendencias} pend.</div>
          </div>`;
        });
      });

      if(!hasAnyPend) {
        html += `<div class="conf-empty"><div class="e-icon">✅</div><p>Todas as UCs estão com o checklist concluído!</p></div>`;
      }

      // UCs sem pendência
      const ucsConcluidas = CURSOS.flatMap(c=>c.ucs.filter(u=>(u.pendencias||0)===0));
      if(ucsConcluidas.length) {
        html += `<div class="conf-curso-label" style="margin-top:16px">✅ UCs com checklist concluído</div>`;
        ucsConcluidas.forEach(uc => {
          const curso = CURSOS.find(c=>c.ucs.some(u=>u.id===uc.id));
          html += `
          <div class="conf-uc-row ok">
            <div class="conf-uc-icone">${uc.icone}</div>
            <div class="conf-uc-info">
              <div class="conf-uc-nome">${uc.nome}</div>
              <div class="conf-uc-fases">${CHECKLIST.map(f=>`<span class="conf-fase-chip ok">${f.fase}. ${f.titulo} ✓</span>`).join('')}</div>
            </div>
            <div class="conf-pend-num ok">✓ OK</div>
          </div>`;
        });
      }

      body.innerHTML = html;
      document.getElementById('bdConf').style.display='flex';
    }

    function abrirChecklistFromConf(cursoId, ucId) {
      fecharConferencia();
      setTimeout(()=>abrirChecklist(cursoId, ucId), 150);
    }

    function fecharConferencia(e) {
      if(!e||e.target===document.getElementById('bdConf'))
        document.getElementById('bdConf').style.display='none';
    }

    /* ══════════════════════════════════════════
       INIT
    ══════════════════════════════════════════ */
    (async () => {
      await loadAll();
      renderCursos();
    })();
  </script>
</body>
</html>

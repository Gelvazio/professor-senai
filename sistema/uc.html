<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" href="favicon.ico" type="image/x-icon"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SENAI — Cursos e Unidades Curriculares</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:"Google Sans",Roboto,Arial,sans-serif;background:#e8eaed;min-height:100vh}

    /* ── HEADER ── */
    .header{background:#004384;color:#fff;padding:0 24px;display:flex;align-items:center;gap:12px;height:56px}
    .header-logo{font-weight:700;font-size:15px;letter-spacing:.5px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:4px;white-space:nowrap;text-decoration:none;color:#fff}
    .header-title{font-size:14px;opacity:.9;white-space:nowrap}
    .header-spacer{flex:1}
    .header-btn{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);border:none;color:#fff;font-size:13px;font-weight:500;padding:6px 14px;border-radius:20px;cursor:pointer;text-decoration:none;transition:background .15s;white-space:nowrap;font-family:inherit}
    .header-btn:hover{background:rgba(255,255,255,.28)}
    .btn-novo-curso{background:#f7941d;border:none;color:#fff;font-size:13px;font-weight:700;padding:7px 16px;border-radius:20px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-novo-curso:hover{background:#e68200}

    /* ── HERO ── */
    .hero{background:linear-gradient(135deg,#003068 0%,#004384 60%,#0055b3 100%);padding:32px 24px 28px;text-align:center;color:#fff;border-bottom:3px solid #f7941d}
    .hero-badge{display:inline-block;background:rgba(247,148,29,.2);border:1px solid rgba(247,148,29,.5);color:#f7941d;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:12px}
    .hero h1{font-size:22px;font-weight:700;margin-bottom:4px}
    .hero p{font-size:13px;opacity:.8}

    /* ── CONTAINER ── */
    .container{max-width:960px;margin:0 auto;padding:28px 24px}
    .section-label{font-size:11px;font-weight:600;color:#666;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}

    /* ── CURSO SECTION ── */
    .curso-section{margin-bottom:24px;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.09);overflow:hidden}
    .curso-header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background .15s;user-select:none}
    .curso-header:hover{background:#f8f9fa}
    .curso-bar{width:5px;height:42px;border-radius:3px;flex-shrink:0}
    .curso-icone{font-size:22px;flex-shrink:0}
    .curso-meta{flex:1;min-width:0}
    .curso-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:2px}
    .curso-nome{font-size:15px;font-weight:700;color:#202124;line-height:1.3}
    .curso-count{font-size:11px;color:#888;margin-top:2px}
    .curso-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .btn-nova-uc{display:flex;align-items:center;gap:5px;background:#004384;color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-nova-uc:hover{background:#00306a}
    .btn-del-curso{background:#fce8e6;color:#c62828;border:none;width:32px;height:32px;border-radius:6px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
    .btn-del-curso:hover{background:#ffcdd2}
    .curso-arrow{font-size:11px;color:#888;transition:transform .22s;flex-shrink:0}
    .curso-section.collapsed .curso-arrow{transform:rotate(-90deg)}

    /* ── UC CONTENT ── */
    .uc-content{padding:16px 20px 20px}
    .curso-section.collapsed .uc-content{display:none}
    .uc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
    @media(max-width:640px){.uc-grid{grid-template-columns:1fr}}

    /* ── UC CARD ── */
    .uc-card{background:#f8f9fa;border-radius:10px;border:1px solid #e8eaed;display:flex;flex-direction:column;transition:box-shadow .2s,transform .15s;cursor:pointer}
    .uc-card:hover{box-shadow:0 4px 16px rgba(0,67,132,.12);transform:translateY(-2px);background:#fff}
    .uc-card-top{height:5px;border-radius:10px 10px 0 0}
    .uc-card-body{padding:14px 16px 10px;flex:1;display:flex;flex-direction:column;gap:8px}
    .uc-header{display:flex;align-items:flex-start;gap:12px}
    .uc-icon{width:40px;height:40px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px}
    .uc-meta{flex:1;min-width:0}
    .uc-num{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#888;margin-bottom:3px}
    .uc-nome{font-size:13px;font-weight:700;color:#202124;line-height:1.35}
    .uc-pasta{font-size:10px;color:#aaa;font-family:monospace;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .uc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
    .badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:20px}
    .badge.ok{background:#e6f4ea;color:#1e7e34}
    .badge.falta{background:#fce8e6;color:#c62828}
    .uc-card-footer{padding:8px 16px 12px;border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .uc-status{display:flex;align-items:center;gap:5px;font-size:10px;color:#888}
    .uc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .btn-abrir{display:inline-flex;align-items:center;gap:5px;background:#004384;color:#fff;text-decoration:none;padding:6px 12px;border-radius:5px;font-size:11px;font-weight:600;border:none;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-abrir:hover{background:#00306a}
    .btn-abrir.alerta{background:#e65100}
    .btn-abrir.alerta:hover{background:#bf360c}
    .btn-del-uc{background:#fce8e6;color:#c62828;border:none;padding:4px 8px;border-radius:4px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
    .btn-del-uc:hover{background:#ffcdd2}

    /* ── EMPTY STATES ── */
    .empty-curso{text-align:center;padding:24px;color:#999;font-size:13px}
    .empty-root{text-align:center;padding:64px 24px;color:#888}
    .empty-root .empty-icon{font-size:52px;margin-bottom:16px}
    .empty-root h3{font-size:18px;font-weight:700;color:#555;margin-bottom:8px}
    .empty-root p{font-size:13px}

    /* ── BACKDROP ── */
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}

    /* ── MODAL ── */
    .modal{background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
    .modal-head{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:1}
    .modal-head h3{margin:0;font-size:15px;font-weight:700;color:#fff}
    .modal-close{background:rgba(255,255,255,.25);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .modal-close:hover{background:rgba(255,255,255,.4)}
    .modal-body{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px}
    .form-row{display:flex;flex-direction:column;gap:5px}
    .form-row label{font-size:12px;font-weight:600;color:#555}
    .form-row input[type=text],.form-row select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;outline:none;transition:border-color .15s;background:#fff;color:#202124}
    .form-row input[type=text]:focus,.form-row select:focus{border-color:#004384;box-shadow:0 0 0 2px rgba(0,67,132,.1)}
    .form-row input[type=color]{width:100%;height:36px;padding:2px 4px;border:1px solid #ddd;border-radius:6px;cursor:pointer}
    .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .form-check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;color:#333}
    .form-check input{width:16px;height:16px;cursor:pointer;accent-color:#004384}
    .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
    .btn-cancel{background:#f1f3f4;color:#444;border:none;padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-cancel:hover{background:#e0e0e0}
    .btn-save{background:#004384;color:#fff;border:none;padding:8px 22px;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-save:hover{background:#00306a}

    /* ── ALERT MODAL ── */
    .alert-modal{background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.3);width:100%;max-width:480px;overflow:hidden}
    .alert-head{background:#e65100;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
    .alert-head h3{margin:0;font-size:15px;font-weight:700}
    .alert-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
    .alert-close:hover{background:rgba(255,255,255,.35)}
    .alert-body{padding:20px 24px 24px}
    .alert-body p{font-size:13px;color:#444;line-height:1.6;margin-bottom:12px}
    .alert-missing{list-style:none;display:flex;flex-direction:column;gap:8px}
    .alert-missing li{display:flex;align-items:center;gap:10px;background:#fce8e6;border-radius:8px;padding:10px 14px;font-size:13px;color:#c62828;font-weight:600}
    .alert-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
    .btn-fechar-alerta{background:#f1f3f4;color:#444;border:none;padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
    .btn-fechar-alerta:hover{background:#e0e0e0}

    /* ── DARK THEME ── */
    [data-theme="dark"] body{background:#0e1117;color:#e0e3e8}
    [data-theme="dark"] .curso-section{background:#1c1e26;box-shadow:0 2px 10px rgba(0,0,0,.4)}
    [data-theme="dark"] .curso-header{border-bottom-color:#2c2e38}
    [data-theme="dark"] .curso-header:hover{background:#252830}
    [data-theme="dark"] .curso-nome{color:#e0e3e8}
    [data-theme="dark"] .curso-label,[data-theme="dark"] .curso-count{color:#6b7280}
    [data-theme="dark"] .uc-card{background:#252830;border-color:#2c2e38}
    [data-theme="dark"] .uc-card:hover{background:#2c2e38;box-shadow:0 4px 16px rgba(0,80,200,.15)}
    [data-theme="dark"] .uc-nome{color:#e0e3e8}
    [data-theme="dark"] .uc-num,[data-theme="dark"] .uc-status,[data-theme="dark"] .uc-pasta{color:#6b7280}
    [data-theme="dark"] .uc-card-footer,[data-theme="dark"] .uc-content{border-top-color:#2c2e38}
    [data-theme="dark"] .badge.ok{background:#1a2e1a;color:#4caf50}
    [data-theme="dark"] .badge.falta{background:#2e1a1a;color:#ef5350}
    [data-theme="dark"] .modal{background:#1c1e26}
    [data-theme="dark"] .form-row input[type=text],[data-theme="dark"] .form-row select{background:#252830;border-color:#2c2e38;color:#e0e3e8}
    [data-theme="dark"] .form-check{color:#c0c6d0}
    [data-theme="dark"] .alert-modal{background:#1c1e26}
    [data-theme="dark"] .alert-body p{color:#c0c6d0}
    [data-theme="dark"] .alert-missing li{background:#2e1a1a;color:#ef5350}
    [data-theme="dark"] .btn-cancel,[data-theme="dark"] .btn-fechar-alerta{background:#252830;color:#b0b6c3}
    [data-theme="dark"] .btn-cancel:hover,[data-theme="dark"] .btn-fechar-alerta:hover{background:#303340}
    [data-theme="dark"] .section-label{color:#8b919e}
    [data-theme="dark"] .empty-root h3{color:#9aa0b0}
    [data-theme="dark"] .empty-root p,[data-theme="dark"] .empty-curso{color:#6b7280}
  </style>
</head>
<body>
  <script>
    (function(){
      if(localStorage.getItem('senai_role')!=='PROFESSOR')
        window.location.replace('dashboard.html');
      const t=localStorage.getItem('senai_tema')||'dark';
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>

  <!-- HEADER -->
  <div class="header">
    <a class="header-logo" href="dashboard.html">SENAI</a>
    <span class="header-title">Cursos e Unidades Curriculares</span>
    <span class="header-spacer"></span>
    <button class="btn-novo-curso" onclick="abrirModalCurso()">+ Novo Curso</button>
    <a class="header-btn" href="dashboard.html">← Voltar</a>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-badge">📚 Professor</div>
    <h1>Cursos e Unidades Curriculares</h1>
    <p>Organize seus cursos e acesse os materiais de cada UC</p>
  </div>

  <!-- CONTENT -->
  <div class="container">
    <div class="section-label" id="sectionLabel"></div>
    <div id="cursosContainer"></div>
  </div>

  <!-- ALERT MODAL (estrutura incompleta) -->
  <div class="backdrop" id="alertBd" style="display:none" onclick="fecharAlerta(event)">
    <div class="alert-modal" onclick="event.stopPropagation()">
      <div class="alert-head">
        <h3>⚠️ Estrutura Incompleta</h3>
        <button class="alert-close" onclick="fecharAlerta()">✕</button>
      </div>
      <div class="alert-body">
        <p id="alertMsg"></p>
        <ul class="alert-missing" id="alertList"></ul>
        <div class="alert-btns">
          <button class="btn-fechar-alerta" onclick="fecharAlerta()">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL NOVO CURSO -->
  <div class="backdrop" id="bdCurso" style="display:none" onclick="fecharModalCurso(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head" style="background:#004384">
        <h3>Novo Curso</h3>
        <button class="modal-close" onclick="fecharModalCurso()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>Nome do Curso *</label>
          <input type="text" id="inCursoNome" placeholder="Ex: Técnico de Informática para Internet"/>
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label>Ícone (emoji)</label>
            <input type="text" id="inCursoIcone" value="🖥️" maxlength="4"/>
          </div>
          <div class="form-row">
            <label>Cor principal</label>
            <input type="color" id="inCursoCor" value="#004384"/>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModalCurso()">Cancelar</button>
          <button class="btn-save" onclick="salvarCurso()">Adicionar Curso</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL NOVA UC -->
  <div class="backdrop" id="bdUC" style="display:none" onclick="fecharModalUC(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head" style="background:#004384">
        <h3>Nova Unidade Curricular</h3>
        <button class="modal-close" onclick="fecharModalUC()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>Curso *</label>
          <select id="inUCCurso"></select>
        </div>
        <div class="form-row">
          <label>Nome da UC *</label>
          <input type="text" id="inUCNome" placeholder="Ex: Lógica de Programação"/>
        </div>
        <div class="form-row">
          <label>Nome da Pasta (dentro de /sistema)</label>
          <input type="text" id="inUCPasta" placeholder="Ex: LOGICA-PROGRAMACAO"/>
        </div>
        <div class="form-grid-2">
          <div class="form-row">
            <label>Ícone (emoji)</label>
            <input type="text" id="inUCIcone" value="📖" maxlength="4"/>
          </div>
          <div class="form-row">
            <label>Cor</label>
            <input type="color" id="inUCCor" value="#004384"/>
          </div>
        </div>
        <div class="form-row">
          <label>Status</label>
          <select id="inUCStatus">
            <option value="Em andamento">Em andamento</option>
            <option value="Prevista" selected>Prevista</option>
            <option value="Concluída">Concluída</option>
            <option value="Suspensa">Suspensa</option>
          </select>
        </div>
        <div style="display:flex;gap:24px;flex-wrap:wrap">
          <label class="form-check">
            <input type="checkbox" id="inUCAulas"/> Pasta AULAS/ já existe
          </label>
          <label class="form-check">
            <input type="checkbox" id="inUCMateriais"/> Pasta MATERIAIS/ já existe
          </label>
        </div>
        <div class="modal-footer">
          <button class="btn-cancel" onclick="fecharModalUC()">Cancelar</button>
          <button class="btn-save" onclick="salvarUC()">Adicionar UC</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'senai_cursos_v2';

    /* ── DADOS PADRÃO ── */
    const DEFAULTS = [
      {
        id: 'tii-rsmtech',
        nome: 'Rio do Sul Mais Tech — Técnico de Informática para Internet',
        icone: '🖥️',
        cor: '#004384',
        custom: false,
        ucs: [
          { id:'uc-tic',  pasta:'INTRODUCAO_A_TECNOLOGIA_DA_INFORMACAO_E_COMUNICACAO',
            nome:'Introdução à Tecnologia da Informação e Comunicação',
            icone:'💻', cor:'#004384', corBg:'#e8f0fe',
            status:'Em andamento', corDot:'#2e7d32', temAulas:true, temMateriais:true, custom:false },
          { id:'uc-oral', pasta:'INTRODUCAO_A_COMUNICACAO_ORAL_E_ESCRITA_PARA_O_MUNDO_DO_TRABALHO',
            nome:'Introdução à Comunicação Oral e Escrita para o Mundo do Trabalho',
            icone:'🗣️', cor:'#6a1b9a', corBg:'#f3e8ff',
            status:'Em andamento', corDot:'#2e7d32', temAulas:false, temMateriais:false, custom:false },
          { id:'uc-logica', pasta:'LOGICA-PROGRAMACAO',
            nome:'Lógica de Programação',
            icone:'⚙️', cor:'#e65100', corBg:'#fff3e0',
            status:'Prevista', corDot:'#f7941d', temAulas:false, temMateriais:false, custom:false },
          { id:'uc-fund', pasta:'FUNDAMENTOS_DA_TECNOLOGIA_E_PROGRAMACAO',
            nome:'Fundamentos da Tecnologia e Programação',
            icone:'🔧', cor:'#1565c0', corBg:'#e3f2fd',
            status:'Prevista', corDot:'#f7941d', temAulas:false, temMateriais:false, custom:false },
          { id:'uc-bd', pasta:'BANCO_DE_DADOS',
            nome:'Banco de Dados',
            icone:'🗄️', cor:'#2e7d32', corBg:'#e8f5e9',
            status:'Prevista', corDot:'#f7941d', temAulas:true, temMateriais:true, custom:false },
          { id:'uc-tii', pasta:'TECNICO DE INFORMATICA PARA INTERNET',
            nome:'Técnico de Informática para Internet',
            icone:'🌐', cor:'#c62828', corBg:'#fce8e6',
            status:'Prevista', corDot:'#f7941d', temAulas:false, temMateriais:false, custom:false },
        ]
      }
    ];

    let CURSOS = [];

    function loadCursos() {
      const raw = localStorage.getItem(STORAGE_KEY);
      CURSOS = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULTS));
    }

    function saveCursos() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(CURSOS));
    }

    function hexToRgba(hex, a) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgba(${r},${g},${b},${a})`;
    }

    function dotColor(status) {
      if (status === 'Em andamento') return '#2e7d32';
      if (status === 'Concluída')    return '#1565c0';
      if (status === 'Suspensa')     return '#c62828';
      return '#f7941d';
    }

    /* ── RENDER ── */
    function renderCursos() {
      const totalUCs = CURSOS.reduce((s, c) => s + c.ucs.length, 0);

      document.getElementById('sectionLabel').textContent =
        `${CURSOS.length} Curso${CURSOS.length !== 1 ? 's' : ''} · ${totalUCs} Unidade${totalUCs !== 1 ? 's Curriculares' : ' Curricular'} — Rio do Sul Mais Tech · SENAI`;

      const cont = document.getElementById('cursosContainer');

      if (!CURSOS.length) {
        cont.innerHTML = `<div class="empty-root">
          <div class="empty-icon">📂</div>
          <h3>Nenhum curso cadastrado</h3>
          <p>Clique em <strong>+ Novo Curso</strong> no topo para começar.</p>
        </div>`;
        return;
      }

      cont.innerHTML = CURSOS.map((curso, ci) => {
        const ucCards = curso.ucs.length === 0
          ? `<div class="empty-curso">Nenhuma UC neste curso. Clique em <strong>+ Nova UC</strong> para adicionar.</div>`
          : `<div class="uc-grid">${curso.ucs.map((uc, ui) => ucCardHTML(curso, ci, uc, ui)).join('')}</div>`;

        return `
        <div class="curso-section" id="cs-${ci}">
          <div class="curso-header" onclick="toggleCurso(${ci})">
            <div class="curso-bar" style="background:${curso.cor}"></div>
            <div class="curso-icone">${curso.icone}</div>
            <div class="curso-meta">
              <div class="curso-label">Curso ${String(ci + 1).padStart(2, '0')}</div>
              <div class="curso-nome">${curso.nome}</div>
              <div class="curso-count">${curso.ucs.length} UC${curso.ucs.length !== 1 ? 's' : ''}</div>
            </div>
            <div class="curso-actions" onclick="event.stopPropagation()">
              <button class="btn-nova-uc" onclick="abrirModalUC('${curso.id}')">+ Nova UC</button>
              ${curso.custom
                ? `<button class="btn-del-curso" title="Excluir curso" onclick="excluirCurso('${curso.id}')">🗑</button>`
                : ''}
            </div>
            <div class="curso-arrow">▼</div>
          </div>
          <div class="uc-content">${ucCards}</div>
        </div>`;
      }).join('');
    }

    function ucCardHTML(curso, ci, uc, ui) {
      const ok     = uc.temAulas && uc.temMateriais;
      const corBg  = uc.corBg || hexToRgba(uc.cor, 0.12);
      const dot    = uc.corDot || dotColor(uc.status);
      const delBtn = uc.custom
        ? `<button class="btn-del-uc" onclick="event.stopPropagation();excluirUC('${curso.id}','${uc.id}')">✕ Remover</button>`
        : '';

      return `
      <div class="uc-card" onclick="abrirUC(${ci},${ui})">
        <div class="uc-card-top" style="background:${ok ? uc.cor : '#e65100'}"></div>
        <div class="uc-card-body">
          <div class="uc-header">
            <div class="uc-icon" style="background:${corBg}">${uc.icone}</div>
            <div class="uc-meta">
              <div class="uc-num">UC ${String(ui + 1).padStart(2, '0')}</div>
              <div class="uc-nome">${uc.nome}</div>
              <div class="uc-pasta">${uc.pasta}</div>
              <div class="uc-badges">
                <span class="badge ${uc.temAulas ? 'ok' : 'falta'}">${uc.temAulas ? '✓' : '✗'} AULAS</span>
                <span class="badge ${uc.temMateriais ? 'ok' : 'falta'}">${uc.temMateriais ? '✓' : '✗'} MATERIAIS</span>
              </div>
            </div>
          </div>
        </div>
        <div class="uc-card-footer">
          <div class="uc-status">
            <div class="uc-dot" style="background:${dot}"></div>
            ${uc.status}
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            ${delBtn}
            <button class="btn-abrir${ok ? '' : ' alerta'}" onclick="event.stopPropagation();abrirUC(${ci},${ui})">
              ${ok ? 'Acessar →' : '⚠️ Incompleta'}
            </button>
          </div>
        </div>
      </div>`;
    }

    function toggleCurso(ci) {
      document.getElementById('cs-' + ci).classList.toggle('collapsed');
    }

    /* ── ABRIR UC ── */
    function abrirUC(ci, ui) {
      const uc = CURSOS[ci].ucs[ui];
      const faltando = [];
      if (!uc.temAulas)    faltando.push('Pasta <strong>AULAS/</strong> não encontrada');
      if (!uc.temMateriais) faltando.push('Pasta <strong>MATERIAIS/</strong> não encontrada');

      if (faltando.length) {
        document.getElementById('alertMsg').innerHTML =
          `A UC <strong>${uc.nome}</strong> está com a estrutura incompleta:`;
        document.getElementById('alertList').innerHTML =
          faltando.map(f => `<li>📁 ${f}</li>`).join('');
        document.getElementById('alertBd').style.display = 'flex';
        return;
      }
      window.location.href = uc.pasta + '/';
    }

    function fecharAlerta(e) {
      if (!e || e.target === document.getElementById('alertBd'))
        document.getElementById('alertBd').style.display = 'none';
    }

    /* ── MODAL CURSO ── */
    function abrirModalCurso() {
      document.getElementById('inCursoNome').value  = '';
      document.getElementById('inCursoIcone').value = '🖥️';
      document.getElementById('inCursoCor').value   = '#004384';
      document.getElementById('bdCurso').style.display = 'flex';
      setTimeout(() => document.getElementById('inCursoNome').focus(), 100);
    }
    function fecharModalCurso(e) {
      if (!e || e.target === document.getElementById('bdCurso'))
        document.getElementById('bdCurso').style.display = 'none';
    }
    function salvarCurso() {
      const nome = document.getElementById('inCursoNome').value.trim();
      if (!nome) { alert('Informe o nome do curso.'); return; }
      CURSOS.push({
        id: 'curso-' + Date.now(),
        nome,
        icone: document.getElementById('inCursoIcone').value.trim() || '🖥️',
        cor:   document.getElementById('inCursoCor').value,
        custom: true,
        ucs: []
      });
      saveCursos();
      renderCursos();
      fecharModalCurso();
    }

    /* ── MODAL UC ── */
    let _ucCursoPresel = null;
    function abrirModalUC(cursoId) {
      _ucCursoPresel = cursoId;
      const sel = document.getElementById('inUCCurso');
      sel.innerHTML = CURSOS.map(c =>
        `<option value="${c.id}"${c.id === cursoId ? ' selected' : ''}>${c.nome}</option>`
      ).join('');
      document.getElementById('inUCNome').value      = '';
      document.getElementById('inUCPasta').value     = '';
      document.getElementById('inUCIcone').value     = '📖';
      document.getElementById('inUCCor').value       = '#004384';
      document.getElementById('inUCStatus').value    = 'Prevista';
      document.getElementById('inUCAulas').checked   = false;
      document.getElementById('inUCMateriais').checked = false;
      document.getElementById('bdUC').style.display  = 'flex';
      setTimeout(() => document.getElementById('inUCNome').focus(), 100);
    }
    function fecharModalUC(e) {
      if (!e || e.target === document.getElementById('bdUC'))
        document.getElementById('bdUC').style.display = 'none';
    }
    function salvarUC() {
      const nome = document.getElementById('inUCNome').value.trim();
      if (!nome) { alert('Informe o nome da UC.'); return; }
      const cursoId  = document.getElementById('inUCCurso').value;
      const cor      = document.getElementById('inUCCor').value;
      const status   = document.getElementById('inUCStatus').value;
      const pastaRaw = document.getElementById('inUCPasta').value.trim();
      const pasta    = pastaRaw || nome.toUpperCase().replace(/\s+/g, '-').replace(/[^A-Z0-9\-_]/g, '');

      const uc = {
        id: 'uc-' + Date.now(),
        nome,
        pasta,
        icone:        document.getElementById('inUCIcone').value.trim() || '📖',
        cor,
        corBg:        hexToRgba(cor, 0.12),
        status,
        corDot:       dotColor(status),
        temAulas:     document.getElementById('inUCAulas').checked,
        temMateriais: document.getElementById('inUCMateriais').checked,
        custom: true
      };

      const curso = CURSOS.find(c => c.id === cursoId);
      if (!curso) return;
      curso.ucs.push(uc);
      saveCursos();
      renderCursos();
      fecharModalUC();
    }

    /* ── EXCLUSÃO ── */
    function excluirCurso(id) {
      if (!confirm('Excluir este curso e todas as suas UCs?\nEsta ação não pode ser desfeita.')) return;
      CURSOS = CURSOS.filter(c => c.id !== id);
      saveCursos();
      renderCursos();
    }
    function excluirUC(cursoId, ucId) {
      if (!confirm('Remover esta UC do curso?')) return;
      const c = CURSOS.find(c => c.id === cursoId);
      if (!c) return;
      c.ucs = c.ucs.filter(u => u.id !== ucId);
      saveCursos();
      renderCursos();
    }

    /* ── INIT ── */
    loadCursos();
    renderCursos();
  </script>
</body>
</html>

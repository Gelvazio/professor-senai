<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ementa × Slides — SENAI</title>
<style>
:root {
  --blue:     #004384;
  --blue-mid: #0055b3;
  --blue-lt:  #e8f0fe;
  --ok:       #1a6b3c;
  --ok-bg:    #e6f4ec;
  --par:      #b36b00;
  --par-bg:   #fff3e0;
  --no:       #c62828;
  --no-bg:    #fce8e6;
  --surface:  #ffffff;
  --ground:   #e8eaed;
  --border:   #dadce0;
  --text:     #202124;
  --text-2:   #5f6368;
  --text-3:   #9aa0a6;
  --header-h: 56px;
  --radius:   8px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface:  #1c1e2a;
    --ground:   #0f1018;
    --border:   #2c2e3a;
    --text:     #e0e3e8;
    --text-2:   #9aa0ae;
    --text-3:   #5f6368;
    --blue-lt:  #1a2540;
    --ok-bg:    #0d2018;
    --par-bg:   #201500;
    --no-bg:    #200808;
  }
}
:root[data-theme="dark"] {
  --surface:  #1c1e2a;
  --ground:   #0f1018;
  --border:   #2c2e3a;
  --text:     #e0e3e8;
  --text-2:   #9aa0ae;
  --text-3:   #5f6368;
  --blue-lt:  #1a2540;
  --ok-bg:    #0d2018;
  --par-bg:   #201500;
  --no-bg:    #200808;
}
:root[data-theme="light"] {
  --surface:  #ffffff;
  --ground:   #e8eaed;
  --border:   #dadce0;
  --text:     #202124;
  --text-2:   #5f6368;
  --text-3:   #9aa0a6;
  --blue-lt:  #e8f0fe;
  --ok-bg:    #e6f4ec;
  --par-bg:   #fff3e0;
  --no-bg:    #fce8e6;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box }
html { font-size:14px }
body {
  font-family: "Google Sans", Roboto, Arial, sans-serif;
  background: var(--ground);
  color: var(--text);
  min-height: 100vh;
}

/* ── Header ── */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--blue);
  height: var(--header-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.25);
}
.header-logo {
  font-weight: 700; font-size: 15px; color: #fff;
  text-decoration: none;
  background: rgba(255,255,255,.18);
  padding: 4px 12px; border-radius: 5px;
  letter-spacing: .5px;
}
.header-title { color: rgba(255,255,255,.85); font-size: 13px; font-weight: 500 }
.header-spacer { flex: 1 }
.header-btn {
  background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
  color: #fff; cursor: pointer; border-radius: 20px;
  padding: 5px 14px; font-size: 12px; font-family: inherit;
  transition: background .15s;
}
.header-btn:hover { background: rgba(255,255,255,.22) }

/* ── Page body ── */
.page { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px }

/* ── Filter bar ── */
.filter-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.filter-bar label { font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap }
.filter-select {
  padding: 6px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px; font-family: inherit;
  background: var(--ground); color: var(--text);
  cursor: pointer; outline: none;
  transition: border-color .15s;
}
.filter-select:focus { border-color: var(--blue) }
.filter-sep { width: 1px; height: 24px; background: var(--border); margin: 0 4px }
.btn-analisar {
  background: var(--blue); color: #fff; border: none;
  padding: 7px 18px; border-radius: 20px; font-size: 12px; font-weight: 600;
  font-family: inherit; cursor: pointer; transition: background .15s;
  white-space: nowrap;
}
.btn-analisar:hover { background: var(--blue-mid) }

/* ── Progress summary ── */
.summary-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px;
  margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.summary-title {
  font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 12px;
}
.summary-stats {
  display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 12px;
}
.stat-pill {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 600;
}
.stat-dot {
  width: 10px; height: 10px; border-radius: 50%;
  flex-shrink: 0;
}
.stat-dot.ok  { background: var(--ok) }
.stat-dot.par { background: var(--par) }
.stat-dot.no  { background: var(--no) }
.stat-count { color: var(--text); font-size: 14px; font-weight: 700 }
.stat-label { color: var(--text-2) }
.progress-track {
  background: var(--border); border-radius: 4px; height: 8px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 4px;
  background: linear-gradient(90deg, var(--ok), #2e9c5a);
  transition: width .5s ease;
}

/* ── Table wrapper ── */
.table-wrap { overflow-x: auto; border-radius: var(--radius) }
.table-wrap table {
  width: 100%; border-collapse: collapse;
  background: var(--surface);
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.table-wrap th {
  background: var(--blue); color: #fff;
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .6px; text-align: left;
  padding: 10px 14px; white-space: nowrap;
  position: sticky; top: var(--header-h);
}
.table-wrap th:first-child { border-radius: var(--radius) 0 0 0 }
.table-wrap th:last-child  { border-radius: 0 var(--radius) 0 0 }
.table-wrap td {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  vertical-align: top; font-size: 13px;
}
.table-wrap tr:last-child td { border-bottom: none }
.table-wrap tr:hover td { background: var(--ground); transition: background .1s }

.td-num {
  font-weight: 800; color: var(--blue); font-size: 12px;
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
.td-nome { font-weight: 600; color: var(--text) }
.td-nome small { display: block; font-weight: 400; color: var(--text-2); font-size: 11px; margin-top: 2px }
.td-ch {
  font-variant-numeric: tabular-nums;
  text-align: center; white-space: nowrap;
  color: var(--text-2); font-size: 12px;
}
.td-ch strong { color: var(--text); font-size: 13px; display: block }
.td-slides { min-width: 240px }

/* ── Status badge ── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border-radius: 12px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.badge.ok  { background: var(--ok-bg);  color: var(--ok)  }
.badge.par { background: var(--par-bg); color: var(--par) }
.badge.no  { background: var(--no-bg);  color: var(--no)  }

/* ── Slide pills ── */
.slide-list { display: flex; flex-direction: column; gap: 6px }
.slide-pill {
  display: flex; align-items: flex-start; gap: 6px;
  background: var(--blue-lt); border-radius: 6px;
  padding: 6px 9px;
}
.slide-pill-aula {
  font-size: 10px; font-weight: 700; color: var(--blue);
  background: rgba(0,67,132,.12); border-radius: 4px;
  padding: 1px 6px; white-space: nowrap; flex-shrink: 0; margin-top: 1px;
}
.slide-pill-info { flex: 1; min-width: 0 }
.slide-pill-titulo {
  font-size: 12px; font-weight: 600; color: var(--text);
  display: block;
}
.slide-pill-titulo a {
  color: inherit; text-decoration: none;
}
.slide-pill-titulo a:hover { text-decoration: underline; color: var(--blue) }
.slide-pill-meta {
  font-size: 11px; color: var(--text-2); margin-top: 1px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.slide-pill-obs { font-size: 11px; color: var(--text-2); margin-top: 2px }
.slide-pill-cob {
  font-size: 10px; font-weight: 700; border-radius: 3px;
  padding: 1px 5px; white-space: nowrap;
}
.slide-pill-cob.total   { background: var(--ok-bg);  color: var(--ok) }
.slide-pill-cob.parcial { background: var(--par-bg); color: var(--par) }
.no-slides-msg { font-size: 12px; color: var(--no); font-style: italic }

/* ── Modal overlay ── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-box {
  background: var(--surface); border-radius: 12px;
  width: 100%; max-width: 460px;
  box-shadow: 0 16px 48px rgba(0,0,0,.3);
  overflow: hidden;
  animation: slideUp .25s ease;
}
@keyframes slideUp {
  from { opacity:0; transform: translateY(20px) }
  to   { opacity:1; transform: translateY(0) }
}
.modal-head {
  background: linear-gradient(135deg, var(--blue) 0%, var(--blue-mid) 100%);
  padding: 24px 24px 20px;
}
.modal-head h2 {
  color: #fff; font-size: 16px; font-weight: 700; margin-bottom: 4px;
}
.modal-head p { color: rgba(255,255,255,.75); font-size: 12px }
.modal-body { padding: 24px }
.modal-field { margin-bottom: 16px }
.modal-field label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-2); margin-bottom: 6px; letter-spacing: .3px;
}
.modal-select {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 14px; font-family: inherit;
  background: var(--ground); color: var(--text); outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.modal-select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(0,67,132,.12);
}
.modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding-top: 4px }
.btn-modal-cancel {
  padding: 9px 20px; border: 1px solid var(--border);
  border-radius: 6px; background: none; color: var(--text-2);
  font-size: 13px; font-family: inherit; cursor: pointer;
  transition: background .15s;
}
.btn-modal-cancel:hover { background: var(--ground) }
.btn-modal-ok {
  padding: 9px 24px; background: var(--blue);
  border: none; border-radius: 6px; color: #fff;
  font-size: 13px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: background .15s;
}
.btn-modal-ok:hover { background: var(--blue-mid) }

/* ── Empty state ── */
.empty-state {
  text-align: center; padding: 60px 20px;
  color: var(--text-2);
}
.empty-state svg { opacity: .35; margin-bottom: 16px }
.empty-state p { font-size: 15px; font-weight: 500 }
.empty-state small { font-size: 12px; margin-top: 4px; display: block }

@media (max-width: 680px) {
  .filter-bar { flex-direction: column; align-items: stretch }
  .filter-select { width: 100% }
  .filter-sep { display: none }
  .summary-stats { gap: 14px }
  .table-wrap th, .table-wrap td { padding: 9px 10px }
}
</style>
</head>

</div>

<!-- ── Conteúdo principal ── -->
<div class="page">

    <div class="filter-sep"></div>
    <label>Matéria:</label>
    <select id="filtroMateria" class="filter-select" onchange="renderTabela()"></select>
    <div class="filter-sep"></div>
    <label>Status:</label>

  </div>

  <!-- Summary -->
  <div class="summary-card" id="summaryCard" style="display:none">
    <div class="summary-title" id="summaryTitle"></div>
    <div class="summary-stats" id="summaryStats"></div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>

  <!-- Table -->
  <div id="tableArea">
    <div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">

// ── Lógica de matérias ────────────────────────────────────────
function getTopicosParaCurso(cursoId) {
  return (EMENTAS[cursoId] || {}).topicos || [];
}

function buildMateriaOptions(cursoId, selectEl) {
  const tops = getTopicosParaCurso(cursoId);
  selectEl.innerHTML = '<option value="">— Todas as matérias —</option>';
  tops.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t.num;
    opt.textContent = `${t.num}. ${t.nome}`;
    selectEl.appendChild(opt);
  });
}

function atualizarMaterias() {
  buildMateriaOptions(document.getElementById('modalCurso').value, document.getElementById('modalMateria'));
}

function renderFiltroMaterias() {
  buildMateriaOptions(document.getElementById('filtroCurso').value, document.getElementById('filtroMateria'));
}

// ── Modal ─────────────────────────────────────────────────────
function abrirModal() {
  document.getElementById('modalOverlay').style.display = 'flex';
}
function fecharModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}
function confirmarSelecao() {
  const curso = document.getElementById('modalCurso').value;
  const mat   = document.getElementById('modalMateria').value;
  document.getElementById('filtroCurso').value = curso;
  renderFiltroMaterias();
  document.getElementById('filtroMateria').value = mat;
  fecharModal();
  renderTabela();
}

// ── Render ────────────────────────────────────────────────────
function renderTabela() {
  const cursoId  = document.getElementById('filtroCurso').value;
  const matFiltro= document.getElementById('filtroMateria').value;
  const stFiltro = document.getElementById('filtroStatus').value;

  const ementa = EMENTAS[cursoId];
  if (!ementa) return;

  let topicos = ementa.topicos;
  if (matFiltro) topicos = topicos.filter(t => t.num === matFiltro);
  if (stFiltro)  topicos = topicos.filter(t => t.status === stFiltro);

  // ── Summary ──
  const all = ementa.topicos;
  const cobertos = all.filter(t => t.status === 'coberto').length;
  const parciais  = all.filter(t => t.status === 'parcial').length;
  const nao       = all.filter(t => t.status === 'nao').length;
  const pct = Math.round(((cobertos + parciais * 0.5) / all.length) * 100);

  document.getElementById('summaryCard').style.display = '';
  document.getElementById('summaryTitle').innerHTML =
    `<strong>${ementa.nome}</strong> &mdash; ${ementa.cargaHoraria}h-aula`;
  document.getElementById('summaryStats').innerHTML = `
    <div class="stat-pill"><span class="stat-dot ok"></span><span class="stat-count">${cobertos}</span><span class="stat-label">Cobertos</span></div>
    <div class="stat-pill"><span class="stat-dot par"></span><span class="stat-count">${parciais}</span><span class="stat-label">Parciais</span></div>
    <div class="stat-pill"><span class="stat-dot no"></span><span class="stat-count">${nao}</span><span class="stat-label">Não abordados</span></div>
    <div class="stat-pill" style="margin-left:auto"><span class="stat-count" style="color:var(--ok)">${pct}%</span><span class="stat-label">cobertura estimada</span></div>
  `;
  document.getElementById('progressFill').style.width = pct + '%';

  // ── Table ──
  if (topicos.length === 0) {
    document.getElementById('tableArea').innerHTML = `
      <div class="empty-state">
        <p>Nenhum tópico encontrado para o filtro selecionado.</p>
      </div>`;
    return;
  }

  const rows = topicos.map(t => {
    const badgeMap = { coberto: ['ok','✅ Coberto'], parcial: ['par','⚠️ Parcial'], nao: ['no','❌ Não Abordado'] };
    const [cls, lbl] = badgeMap[t.status] || ['no','❌'];

    const slidesHtml = t.slides.length
      ? `<div class="slide-list">${t.slides.map(s => `
          <div class="slide-pill">
            <span class="slide-pill-aula">Aula ${s.aula}</span>
            <div class="slide-pill-info">
              <span class="slide-pill-titulo"><a href="${s.arquivo}" target="_blank">${s.titulo}</a></span>
              <div class="slide-pill-meta">
                <span>${s.qtd} slides</span>
                <span class="slide-pill-cob ${s.cob}">${s.cob === 'total' ? 'Total' : 'Parcial'}</span>
              </div>
              <div class="slide-pill-obs">${s.obs}</div>
            </div>
          </div>`).join('')}</div>`
      : `<span class="no-slides-msg">Nenhum slide criado</span>`;

    const subHtml = t.subTopicos.length
      ? `<small>${t.subTopicos.slice(0, 4).join(' · ')}${t.subTopicos.length > 4 ? ' …' : ''}</small>`
      : '';

    return `<tr>
      <td class="td-num">${t.num}</td>
      <td class="td-nome">${t.nome}${subHtml}</td>
      <td class="td-ch"><strong>${t.ch}</strong>h-aula</td>
      <td class="td-slides">${slidesHtml}</td>
      <td><span class="badge ${cls}">${lbl}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('tableArea').innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tópico da Ementa</th>
            <th>C.H.</th>
            <th>Slides Criados</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Init ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', function() {
  atualizarMaterias();      // preenche modal matérias
  renderFiltroMaterias();   // preenche filtro matérias

  // Proteção de acesso
  const role = localStorage.getItem('senai_role');
  if (!role) window.location.href = 'index.html';
});
</script>

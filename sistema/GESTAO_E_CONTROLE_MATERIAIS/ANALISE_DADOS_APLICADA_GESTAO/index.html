<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Dados Aplicada à Gestão</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1f4e79 0%, #2a5a9e 100%);
            color: white;
            padding: 40px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-ementa {
            background: #fff;
            color: #1f4e79;
            border: 2px solid #fff;
        }

        .btn-ementa:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-reload {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-reload:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .content {
            padding: 40px;
            min-height: calc(100vh - 250px);
            overflow-y: auto;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #f5c6cb;
            margin: 20px 0;
        }

        /* Estilos para markdown */
        .markdown-content h1 {
            color: #1f4e79;
            font-size: 28px;
            margin-top: 30px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .markdown-content h2 {
            color: #2a5a9e;
            font-size: 22px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .markdown-content h3 {
            color: #3a6abe;
            font-size: 18px;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .markdown-content h4 {
            color: #4a7abe;
            font-size: 16px;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .markdown-content p {
            line-height: 1.8;
            margin-bottom: 15px;
            color: #333;
        }

        .markdown-content ul, .markdown-content ol {
            margin-left: 30px;
            margin-bottom: 15px;
            color: #333;
        }

        .markdown-content li {
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .markdown-content table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .markdown-content table td {
            border-bottom: 1px solid #ddd;
            padding: 12px;
            color: #333;
        }

        .markdown-content table tr:hover {
            background: #f5f5f5;
        }

        .markdown-content strong {
            color: #1f4e79;
            font-weight: 600;
        }

        .markdown-content hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, transparent, #667eea, transparent);
            margin: 30px 0;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        .modal-header h2 {
            color: #1f4e79;
            font-size: 24px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #667eea;
            transition: color 0.3s ease;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #1f4e79;
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 20px;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .markdown-content h1 {
                font-size: 22px;
            }

            .markdown-content h2 {
                font-size: 18px;
            }
        }

        /* Scrollbar personalizado */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>📊 Análise de Dados Aplicada à Gestão</h1>
                <p>Unidade Curricular - Aprendizagem Industrial</p>
            </div>
            <div class="header-buttons">
                <button class="btn btn-ementa" onclick="abrirEmenta()">📋 EMENTA</button>
                <button class="btn btn-reload" onclick="recarregarPlano()">🔄 Recarregar</button>
            </div>
        </div>

        <div class="content" id="conteudo">
            <div class="loading">Carregando plano de aulas</div>
        </div>
    </div>

    <!-- Modal para Ementa -->
    <div id="modalEmenta" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Ementa da Disciplina</h2>
                <button class="close-btn" onclick="fecharEmenta()">&times;</button>
            </div>
            <div id="ementaConteudo" class="markdown-content"></div>
        </div>
    </div>

    <script>
        // Configurar marked para melhor formatação
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false,
            pedantic: false,
            sanitize: false,
            smartLists: true,
            smartypants: false
        });

        // Carregar plano de aulas ao iniciar
        window.addEventListener('DOMContentLoaded', function() {
            carregarPlano();
        });

        function carregarPlano() {
            const conteudo = document.getElementById('conteudo');
            conteudo.innerHTML = '<div class="loading">Carregando plano de aulas</div>';

            fetch('PLANO-AULAS-ANALISE-DADOS-APLICADA-GESTAO.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro ao carregar plano: ${response.status}`);
                    }
                    return response.text();
                })
                .then(markdown => {
                    const html = marked.parse(markdown);
                    conteudo.innerHTML = `<div class="markdown-content">${html}</div>`;
                })
                .catch(erro => {
                    console.error('Erro:', erro);
                    conteudo.innerHTML = `
                        <div class="error">
                            <strong>Erro ao carregar o plano de aulas:</strong><br>
                            ${erro.message}<br><br>
                            Verifique se o arquivo <strong>PLANO-AULAS-ANALISE-DADOS-APLICADA-GESTAO.md</strong> está na mesma pasta do index.html
                        </div>
                    `;
                });
        }

        function recarregarPlano() {
            carregarPlano();
        }

        function abrirEmenta() {
            const modal = document.getElementById('modalEmenta');
            const ementaConteudo = document.getElementById('ementaConteudo');

            ementaConteudo.innerHTML = '<div class="loading">Carregando ementa</div>';
            modal.classList.add('show');

            fetch('EMENTA-ANALISE-DADOS-APLICADA-GESTAO.md')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Erro ao carregar ementa: ${response.status}`);
                    }
                    return response.text();
                })
                .then(markdown => {
                    const html = marked.parse(markdown);
                    ementaConteudo.innerHTML = html;
                })
                .catch(erro => {
                    console.error('Erro:', erro);
                    ementaConteudo.innerHTML = `
                        <div class="error">
                            <strong>Erro ao carregar a ementa:</strong><br>
                            ${erro.message}<br><br>
                            Verifique se o arquivo <strong>EMENTA-ANALISE-DADOS-APLICADA-GESTAO.md</strong> está na mesma pasta do index.html
                        </div>
                    `;
                });
        }

        function fecharEmenta() {
            const modal = document.getElementById('modalEmenta');
            modal.classList.remove('show');
        }

        // Fechar modal ao clicar fora do conteúdo
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('modalEmenta');
            if (event.target === modal) {
                fecharEmenta();
            }
        });

        // Fechar modal com tecla ESC
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                fecharEmenta();
            }
        });
    </script>
</body>
</html>
